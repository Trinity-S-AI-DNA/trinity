# Scan GitHub for repositories that write .t27 specs and keep the catalog current.
#
# The catalog behind #/specs and the Queen map knew five repositories, each typed
# into apps/website/scripts/sync-t27-specs.mjs by hand. gHashTag/trios (71 specs)
# sat in the same owner's public inventory unnoticed, and
# dmitrii-f-t27/trinity-memory belongs to another owner, so no list would have
# found it. This runs the scan whose contract is
# apps/website/public/t27/files/specs/catalog/discovery.t27 (owners, exclusions,
# what qualifies), vendors what qualifies, rebuilds the shared core and the
# atlas, runs the catalog gates and commits the data -- the way
# signal-health-self.yml commits its numbers.
#
# Publishing stays with deploy-site.yml, manual on purpose: content is approved
# before it goes out.
#
# The five founding sources ARE refreshed here now. They used to be excluded
# because sync-t27-specs.mjs read a working copy at /Users/playom/t27, which no
# runner has -- so the repository holding two thirds of the corpus was the one
# repository this job could not touch, and gHashTag/t27 drifted 540 specs behind
# its own master while this job ran nightly. It reads GitHub now, and the
# teaching course, which lives on a branch never merged to master, comes in
# through a named overlay ref that contributes only the paths master lacks.
name: t27 world scan

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      verify:
        description: 'Run the incremental-sync check instead of the scan: old script, then new cold, warm and forced-full runs, trees diffed, per-phase timings in the job summary. Commits nothing.'
        type: boolean
        default: false
      baseline_ref:
        description: 'Ref whose sync-t27-specs.mjs is the "before" in the check'
        type: string
        default: main

permissions:
  contents: write
  pull-requests: write
  # To start pr-blog-report.yml for the pull request this job opens (below).
  actions: write

jobs:
  scan:
    if: ${{ !inputs.verify }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - run: npm ci

      # Public reads only: owner inventories, code search, trees, blobs, tarballs,
      # open issues. The token is the workflow's own; nothing is written to GitHub
      # by these commands, and the reports carry no credentials.
      - name: Scan, vendor, index, atlas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The founding sources first, because this writes the manifest the
          # vendor step then merges discovered worlds into. It used to be left
          # out of this job on the grounds that it read a working copy on one
          # developer's laptop -- which it no longer does, and which is why
          # gHashTag/t27 sat 540 specs behind its own master while a daily job
          # claimed to keep the catalog current.
          node scripts/sync-t27-specs.mjs
          # The sync keeps the generated trinity/cli cards; rebuild them against the
          # trinity/tri cards it just vendored, which decide what is already covered.
          node scripts/tools-from-trinity-tri.mjs
          npm run discover -- scan --out "$RUNNER_TEMP/discovery.json"
          npm run discover -- vendor --report "$RUNNER_TEMP/discovery.json"
          npm run core -- index
          # The generated catalogs pin the manifest by hash (check:agents, check:docs refuse
          # a stale one), so they are rebuilt here exactly as prebuild rebuilds them.
          node scripts/skills-core.mjs index
          node scripts/agents-from-specs.mjs
          node scripts/docs-from-specs.mjs
          npm run atlas -- scan --discovery "$RUNNER_TEMP/discovery.json" --out "$RUNNER_TEMP/atlas-report.json"
          npm run atlas -- build --report "$RUNNER_TEMP/atlas-report.json"
          # onboarding.t27 states the corpus counts this refresh just moved. Write the manifest's
          # into it, dated today, and regenerate /agents.t27 and /llms.txt from it, so the gate
          # below compares a published document with the manifest it is published beside.
          node scripts/onboarding-from-spec.mjs --sync
          # A lesson page prints its spec. When the scan brings t27's newer clean copy of
          # one, its static page under learn/ is redrawn here, or check:course-pages below
          # refuses the refresh (#1535 left 126 pages behind their specs).
          node scripts/course-pages.mjs
          node -e "const r=require('$RUNNER_TEMP/discovery.json');console.log('worlds: '+r.worlds.join(', ')+'; founding: '+r.founding.length+'; code search: '+r.codeSearch.status)" >> "$GITHUB_STEP_SUMMARY"

      # The same gates a PR runs on the catalog, against the tree about to be committed.
      - name: Catalog gates
        run: |
          set -euo pipefail
          npm run check:discovery
          npm run check:shared-core
          npm run check:spec-catalog
          npm run check:queen-atlas
          npm run check:queen-catalog
          npm run check:queen-continuous
          npm run check:queen-spec-mirrors
          npm run check:skills-catalog
          npm run check:crons-catalog
          npm run check:agents
          npm run check:tools
          npm run check:docs
          # onboarding.t27 states the corpus counts and the publish refuses them when they
          # disagree with the manifest. #1176 refreshed the manifest without this check and
          # t27.ai stopped publishing. The scan step now writes the counts (--sync), so this
          # stops a refresh only for what the sync does not own: BACKENDS, a constant with no
          # line to write, a value its declared type cannot hold.
          npm run check:onboarding
          # #1176 also vendored two gf16 ports that check:silicon requires to be classified.
          npm run check:silicon
          # The publisher builds the courses and refuses a lesson whose spec is missing or
          # not clean. #1535 deleted 33 lesson specs and swapped seven, nothing here ran
          # the course check (a PR this workflow opens starts no other workflow), and
          # t27.ai stopped publishing. The sync now keeps lesson specs
          # (scripts/lesson-specs.mjs); this stops a refresh that breaks a course anyway.
          npm run check:course
          npm run check:course-pages

      # Ruleset 23148303 ("T27 mandatory work report") requires the status check
      # "T27 work report" on refs/heads/main and lists no bypass actors, so the
      # `git push` this step used to end with is rejected with GH013 -- the same
      # answer a person gets. The way in is the way everyone else takes: a branch,
      # a pull request, and a report the validator accepts. The report is
      # generated from the artifacts this run just wrote (scripts/
      # catalog-work-report.mjs), so it states the refresh that happened rather
      # than a template.
      - name: Open or update the catalog pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  't27 world scan'
          git config user.email 'admin@t27.ai'
          git add public/t27 public/skills public/crons public/agents public/tools public/functions public/docs public/learn public/ru/learn qa/language-exceptions.json specs/catalog/onboarding.t27 public/agents.t27 public/llms.txt
          if git diff --cached --quiet; then
            echo "- no change" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          N=$(node -e "const m=require('./public/t27/manifest.json');console.log(m.repos.length+' repositories, '+m.specCount+' specs')")
          git commit -q -m "t27 worlds: refresh the catalog ($N)"
          BRANCH=bot/t27-world-scan
          # The bot's own branch, and only ever this job writes it -- so the
          # lease is against the branch as this run found it, not against a human.
          # The checkout fetched main alone, so a bare --force-with-lease has no
          # tracking ref to compare with and expects the branch to be absent: once
          # the first refresh had created it, every push was refused as "stale
          # info" (the nights of 2026-09-17..20). Name the expected value
          # explicitly; an empty one still means "must not exist yet".
          EXPECT=$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)
          git push -q --force-with-lease="refs/heads/$BRANCH:$EXPECT" origin "HEAD:refs/heads/$BRANCH"
          SHA=$(git rev-parse HEAD)
          node scripts/catalog-work-report.mjs --head-sha "$SHA" --out "$RUNNER_TEMP/catalog-report.md"
          PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            # Yesterday's refresh is still open: move it to today's commit and
            # today's numbers rather than opening a second one beside it.
            gh pr edit "$PR" --title "t27 worlds: refresh the catalog ($N)" --body-file "$RUNNER_TEMP/catalog-report.md"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "t27 worlds: refresh the catalog ($N)" \
              --body-file "$RUNNER_TEMP/catalog-report.md"
            PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          fi
          echo "- pushed $BRANCH and opened/updated PR #$PR: $N" >> "$GITHUB_STEP_SUMMARY"
          # The one required check, "T27 work report", is posted by
          # pr-blog-report.yml on pull_request_target -- and an event caused by
          # this job's GITHUB_TOKEN starts no workflow, so the refresh it opened
          # sat BLOCKED with no report ever posted (PR #1176: 1737 specs, open
          # while the site went on serving 1577). workflow_dispatch is the one
          # event the token may start; the report job validates the body above
          # against the head it reads from the API, as it would for a person.
          gh workflow run pr-blog-report.yml --ref main -f pr="$PR"
          echo "- started the work-report check for PR #$PR" >> "$GITHUB_STEP_SUMMARY"
          # The site's own checks never ran on #1535 for the same reason: it was
          # merged 70 s after it opened with no website-checks run on it at all,
          # its course specs deleted, and the publisher then refused t27.ai.
          # Dispatched on the branch, the run lands on the head commit, so whoever
          # reviews the refresh sees course, course-pages and the rest red or green.
          gh workflow run website-checks.yml --ref "$BRANCH"
          echo "- started website-checks on $BRANCH for PR #$PR" >> "$GITHUB_STEP_SUMMARY"
          # NO SELF-ARMED MERGE. Owner's rule, 2026-10-02: "the Queen must not
          # merge by herself!! the Queen only manages!" -- no automation merges
          # on its own verdict. This job used to arm `gh pr merge --squash
          # --auto` on the pull request it had just opened, so its own green
          # check was the merge. Now the refresh stays open for a reviewer bee:
          # an APPROVED review plus the `bee-reviewed` label added after the
          # head commit (the gate of gHashTag/t27#5526). If an earlier run left
          # auto-merge armed, take it back -- a new head is unreviewed code.
          gh pr merge "$PR" --disable-auto >/dev/null 2>&1 || true
          echo "- PR #$PR is open and waits for a reviewer bee (bee-reviewed); this job does not merge it" >> "$GITHUB_STEP_SUMMARY"

  # Proves sync-t27-specs.mjs is incremental without being different: the script as it stood
  # on baseline_ref (which wipes and rebuilds everything) and the current one, cold, warm
  # and forced full, must leave the same tree. Nothing is committed or opened.
  verify-incremental:
    if: ${{ inputs.verify }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/website
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - run: npm ci
      - name: Old, cold, warm and forced-full syncs
        run: |
          set -euo pipefail
          # Tree digest: every file under public/t27 except the manifest, then the manifest with
          # the fields the incremental build adds removed, then the RU-audit exceptions file.
          norm='del(.generatedFrom.analysisKey) | del(.specs[]?.sha256) | del(.duplicates[]?.sha256)'
          snap() {
            ( cd public/t27 && find . -type f ! -name manifest.json | sort | xargs sha256sum
              jq -c "$norm" manifest.json | sha256sum | sed 's/-$/manifest-normalised/'
              sha256sum < manifest.json | sed 's/-$/manifest-raw/' ) > "/tmp/$1.snap"
            sha256sum qa/language-exceptions.json >> "/tmp/$1.snap"
          }
          timed() { local t0=$(date +%s); "$@" | tee "/tmp/$LABEL.log"; echo "$LABEL total $(( $(date +%s) - t0 ))s" >> /tmp/walls.txt; }

          # t27 master moves during the hour this takes; the four runs must read the same commit.
          export T27_REF=$(gh api repos/gHashTag/t27/commits/master --jq .sha)
          export T27_OVERLAY_REFS=$(gh api repos/gHashTag/t27/commits/fix/reject-vibee-specs --jq .sha)
          echo "t27 pinned at $T27_REF (overlay $T27_OVERLAY_REFS)"

          git fetch --depth=1 origin "${{ inputs.baseline_ref }}"
          git show FETCH_HEAD:apps/website/scripts/sync-t27-specs.mjs > scripts/sync-t27-specs.baseline.mjs
          LABEL=old timed node scripts/sync-t27-specs.baseline.mjs
          rm scripts/sync-t27-specs.baseline.mjs
          snap old

          LABEL=cold timed node scripts/sync-t27-specs.mjs
          snap cold

          # A removed spec and a damaged one: the warm run must delete the first, restore the second.
          echo stale > public/t27/files/zz-removed-upstream.t27
          victim=$(jq -r '[.specs[] | select(.repo != "t27")][0].path' public/t27/manifest.json)
          echo tampered >> "public/t27/files/$victim"
          LABEL=warm timed node scripts/sync-t27-specs.mjs
          snap warm

          LABEL=full T27_FULL=1 timed node scripts/sync-t27-specs.mjs
          snap full

          {
            echo '### sync-t27-specs: before and after'
            echo
            echo '| run | wall | what it did |'
            echo '| --- | --- | --- |'
            for r in old cold warm full; do
              echo "| $r | $(grep "^$r total" /tmp/walls.txt | cut -d' ' -f3) | $(grep -m1 'incremental:' /tmp/$r.log | sed 's/^ *//' || true) |"
            done
            echo
            echo '#### Per-phase timings'
            for r in cold warm full; do echo; echo "$r:"; echo '```'; grep 'timing:' /tmp/$r.log; echo '```'; done
            echo; echo 'old (baseline script):'; echo '```'; grep -E 'sync-t27-specs:|duplicate files' /tmp/old.log || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          rc=0
          for pair in "old cold" "cold warm" "cold full"; do
            set -- $pair
            if [ "$1" = old ]; then
              grep -v manifest-raw /tmp/$1.snap > /tmp/a.snap; grep -v manifest-raw /tmp/$2.snap > /tmp/b.snap
            else
              cp /tmp/$1.snap /tmp/a.snap; cp /tmp/$2.snap /tmp/b.snap
            fi
            if diff /tmp/a.snap /tmp/b.snap > /tmp/d.txt; then echo "$1 == $2: identical ($(wc -l < /tmp/b.snap) digests)" | tee -a "$GITHUB_STEP_SUMMARY"
            else echo "$1 != $2:"; head -40 /tmp/d.txt; echo "**$1 != $2**" >> "$GITHUB_STEP_SUMMARY"; rc=1; fi
          done
          grep -q 'zz-removed-upstream' /tmp/warm.snap && { echo 'stale file survived the warm run'; rc=1; } || true
          exit $rc
