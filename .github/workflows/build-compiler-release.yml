# VIBEE Compiler - Multi-Platform Release Build
# Builds binaries for Linux (x86_64, aarch64) and macOS (x86_64, arm64)
# φ² + 1/φ² = 3 | PHOENIX = 999

name: Build Compiler Release

# NOT 'v*'. This workflow publishes its own release body with its own asset
# table, and so does Binary Release (release.yml). On a v* tag both fired
# against the same tag and whichever finished last overwrote the other's notes
# -- on v10.1.0 the surviving body advertised files the run had not produced.
# `compiler-v*` was already in this list, so a separate namespace was always the
# intent; this just stops the two from racing.
#
# The pull_request trigger is not decoration. Nothing on any pull request built
# src/vibeec, so the tree drifted out of step with zig 0.15 unobserved and the
# first thing to notice was a release tag -- which is the worst possible moment.
# The create-release job below is gated on refs/tags, so a pull request builds
# the four binaries and publishes nothing.
on:
  push:
    tags:
      - 'compiler-v*'
  pull_request:
    paths:
      - 'src/vibeec/**'
      - '.github/workflows/build-compiler-release.yml'
  workflow_dispatch:

env:
  ZIG_VERSION: '0.15.2'

jobs:
  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux-gnu, aarch64-linux-gnu]
        include:
          - target: x86_64-linux-gnu
            binary_name: vibeec-linux-x86_64
          - target: aarch64-linux-gnu
            binary_name: vibeec-linux-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build compiler
        run: |
          cd src/vibeec
          zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
          cp zig-out/bin/vibeec ../../${{ matrix.binary_name }}
          chmod +x ../../${{ matrix.binary_name }}

      # Only x86_64 is native on this runner; the aarch64 build cannot be
      # executed here. Where it CAN run, it has to run: `|| echo "continuing"`
      # made this step incapable of failing, which is not a smoke test.
      - name: Test binary (if native)
        run: |
          if [[ "${{ matrix.target }}" == "x86_64-linux-gnu" ]]; then
            ./${{ matrix.binary_name }} --version
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}
          retention-days: 7

  build-macos:
    name: Build macOS (${{ matrix.target }})
    # NOT macos-latest. That image is macOS 26.6 with the Xcode 26.6 SDK, and
    # zig 0.15.2 cannot link its own build runner against libc there -- every
    # libSystem symbol comes back undefined from build_zcu.o, before any of this
    # repository's code is looked at. Measured 2026-09-20: macos-14 (Xcode 15.4)
    # links it, macos-latest does not. Same pin, same reason, as release.yml.
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-macos, aarch64-macos]
        include:
          - target: x86_64-macos
            binary_name: vibeec-macos-x86_64
          - target: aarch64-macos
            binary_name: vibeec-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build compiler
        run: |
          cd src/vibeec
          zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
          cp zig-out/bin/vibeec ../../${{ matrix.binary_name }}
          chmod +x ../../${{ matrix.binary_name }}

      # macos-14 is an arm64 runner, so only the aarch64 build is native here.
      # The old version of this step ran unconditionally and swallowed the
      # failure, which is how an x86_64 binary that cannot execute on this
      # machine passed a "test binary" step on every release.
      - name: Test binary (if native)
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-macos" ]]; then
            ./${{ matrix.binary_name }} --version
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}
          retention-days: 7

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: List artifacts
        run: |
          find . -type f -name "vibeec-*" | xargs ls -la

      - name: Create checksums
        run: |
          for f in vibeec-*; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # The compiler is not the repository's headline artifact -- Binary
          # Release is. Leaving this at the action's default (true) would make a
          # compiler-v* tag the release users are offered on the front page.
          make_latest: false
          files: |
            vibeec-*
            vibeec-*.sha256
          body: |
            ## VIBEE Compiler ${{ github.ref_name }}

            **φ² + 1/φ² = 3 | PHOENIX = 999**

            ### Multi-Platform Binaries

            | Platform | Architecture | Binary |
            |----------|--------------|--------|
            | Linux | x86_64 | `vibeec-linux-x86_64` |
            | Linux | ARM64 (aarch64) | `vibeec-linux-aarch64` |
            | macOS | x86_64 (Intel) | `vibeec-macos-x86_64` |
            | macOS | ARM64 (Apple Silicon) | `vibeec-macos-arm64` |

            This is `vibeec`, the compiler built from `src/vibeec`. It is not the
            `vibee` binary shipped by Binary Release — that one comes from the
            top-level build. The files used to be named `vibee-*` here, which
            made two different programs look like one.

            ### Installation

            ```bash
            # Download appropriate binary
            curl -LO https://github.com/gHashTag/trinity/releases/download/${{ github.ref_name }}/vibeec-linux-x86_64

            # Make executable
            chmod +x vibeec-linux-x86_64

            # Move to PATH
            sudo mv vibeec-linux-x86_64 /usr/local/bin/vibeec
            ```

            ### Verification

            ```bash
            # Check SHA256
            sha256sum -c vibeec-linux-x86_64.sha256

            # Test
            vibeec --version
            vibeec --help
            ```

            ### Notes
            - All binaries built with `-Doptimize=ReleaseSafe` (safe for all CPUs)
            - Compiled with Zig ${{ env.ZIG_VERSION }}

            **Golden Chain is closed. KOSCHEI is immortal.**
          draft: false
          prerelease: false
