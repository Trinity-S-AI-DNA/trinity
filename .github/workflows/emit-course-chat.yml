name: Course chat spec (t27c test-report and gen-ts)

# Written by `t27c gen-text --fn workflow_yml` from apps/website/specs/ci/course_chat_workflow.t27,
# never by hand: edit that spec, let this job emit the file, commit the emitted bytes (the last
# gate below fails while the committed file differs from the emitted one).
# FR-201..FR-208 of Trinity-S-AI-DNA/trinity#1813: the course helper chat is one spec,
# apps/website/specs/chat/course-chat.t27. The Mac never runs t27c, so this job is the lab. It
#   1. builds t27c from the pinned t27 revision and sets up the Zig that t27 runs its harness with,
#   2. runs the tests of the chat spec and of the spec that writes this file (test-report prints
#      its verdicts; this job reads what it prints),
#   3. runs the negative controls: sixteen copies of the chat spec, each with one cap or rule turned
#      wrong (IP limit, key limit, daily cap, turns, paid fallback, round opener, opener size, offline send,
#      offline probe, Send and Close tap size, notch margin, dvh height, reduced motion, head avatar, opening motion), must
#      each turn its own test red, and the job fails when one stays green,
#   4. writes src/lib/courseChat.gen.ts with `t27c gen-ts` and this workflow with `t27c gen-text`,
#      and uploads both as the artifact "course-chat" (to commit by hand, because a push made with
#      GITHUB_TOKEN starts no workflow),
#   5. fails when a test did not pass, when a planted bug stayed green, or when a committed file
#      (the module, this workflow) differs from the emitted one.
# The shell lines below are plumbing around t27c, one tool call per line; the rule is t27.

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/website/specs/chat/**"
      - "apps/website/specs/ci/**"
      - "apps/website/src/lib/courseChat.gen.ts"
      - ".github/workflows/emit-course-chat.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emit-course-chat-${{ github.ref }}
  cancel-in-progress: true

env:
  # The same t27 revision the widget-page job pins (gHashTag/t27#13568).
  T27_EMITTER_REVISION: 06522649ba5006c206d89af4c70c45590461a691
  T27_ZIG_VERSION: 0.16.0

jobs:
  emit:
    name: Test the chat spec and emit its TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check out gHashTag/t27 at the emitter revision
        uses: actions/checkout@v4
        with:
          repository: gHashTag/t27
          ref: ${{ env.T27_EMITTER_REVISION }}
          path: t27-pinned
          fetch-depth: 1

      # plumbing: build the compiler from that revision with its own Cargo.lock
      - name: Build t27c
        run: cargo build --release --locked -p t27c --manifest-path t27-pinned/Cargo.toml --target-dir t27c-target

      - name: Setup the Zig that t27 runs its harness with
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.T27_ZIG_VERSION }}
          use-cache: false

      # plumbing: put t27c on the PATH, make the output folders
      - name: Put t27c on the PATH
        run: |
          echo "$PWD/t27c-target/release" >> "$GITHUB_PATH"
          mkdir -p emit-out/logs emit-out/negative emit-out/workflow

      # plumbing: test-report prints its verdicts and the gates below read them
      - name: Test the chat spec and the workflow spec
        run: for f in apps/website/specs/chat/course-chat.t27 apps/website/specs/ci/course_chat_workflow.t27; do t27c test-report "$f" --specs-dir apps/website/specs; done > emit-out/logs/test-report.log 2>&1 || true

      # plumbing: the planted bugs of the negative controls, one sed line and one test-report on a copy each
      - name: Plant one bug per cap in a copy of the spec and test each copy
        run: |
          plant() { sed "s/$2/$3/" apps/website/specs/chat/course-chat.t27 > "emit-out/negative/$1.t27"; t27c test-report "emit-out/negative/$1.t27" --specs-dir apps/website/specs > "emit-out/logs/bug-$1.log" 2>&1 || true; }
          plant ip 'ip_count >= CHAT_PER_IP_HOUR' 'ip_count > CHAT_PER_IP_HOUR'
          plant key 'key_count >= CHAT_PER_KEY_DAY' 'key_count > CHAT_PER_KEY_DAY'
          plant global 'global_count >= CHAT_GLOBAL_DAY' 'global_count > CHAT_GLOBAL_DAY'
          plant turns 'turn >= CHAT_TURNS_MAX' 'turn > CHAT_TURNS_MAX'
          plant paid 'CHAT_PAID_FALLBACK : u32 = 0' 'CHAT_PAID_FALLBACK : u32 = 1'
          plant round 'border:1px solid #fff;border-radius:50%' 'border:1px solid #fff;border-radius:4px'
          plant tap 'CHAT_AVATAR_PX : u32 = 67' 'CHAT_AVATAR_PX : u32 = 32'
          plant send 'if (!up) { return ACT_REPROBE; }' 'if (!up) { return ACT_IGNORE; }'
          plant probe 'status == 503) { return REASON_OFF; }' 'status == 503) { return REASON_BUSY; }'
          plant gosize 'padding:0 14px;min-width:44px;min-height:44px' 'padding:0 14px;min-width:24px;min-height:24px'
          plant notch 'bottom:calc(var(--cc-gap) + env(safe-area-inset-bottom,0px));z-index:31' 'bottom:var(--cc-gap);z-index:31'
          plant dvh 'max-height:calc(100dvh - 16px);padding:0' 'max-height:calc(100vh - 16px);padding:0'
          plant close 'min-width:44px;min-height:44px;padding:0 6px' 'min-width:24px;min-height:24px;padding:0 6px'
          plant reduce '@media (prefers-reduced-motion:reduce){.cc,' '@media (prefers-reduced-motion:no-preference){.cc,'
          plant avhead '.cc-av{display:block;flex:none;width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid #fff}.cc-title' '.cc-av{display:none}.cc-title'
          plant grow '.cc.is-open{transition:clip-path .55s cubic-bezier(.22,1,.36,1),opacity .12s' '.cc.is-open{transition:opacity .12s'

      # plumbing: gen-ts prints the module to stdout; its first line is the only one this job keeps apart
      - name: Emit courseChat.gen.ts
        run: |
          mkdir -p emit-out/apps/website/src/lib
          t27c gen-ts apps/website/specs/chat/course-chat.t27 > emit-out/apps/website/src/lib/courseChat.gen.ts 2> emit-out/logs/gen-ts.err || echo gen-ts >> emit-out/failed.txt
          cp emit-out/apps/website/src/lib/courseChat.gen.ts apps/website/src/lib/courseChat.gen.ts
          wc -c apps/website/src/lib/courseChat.gen.ts > emit-out/logs/sizes.txt

      # plumbing: gen-text runs the spec's own function and writes the bytes it filled in
      - name: Emit this workflow from its spec
        run: t27c gen-text apps/website/specs/ci/course_chat_workflow.t27 --fn workflow_yml -o emit-out/workflow/emit-course-chat.yml || echo workflow >> emit-out/failed.txt

      - name: Upload the module, the workflow and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-chat
          path: emit-out
          if-no-files-found: warn

      - name: Gate, the module and the workflow emitted
        run: |
          if test -f emit-out/failed.txt; then cat emit-out/failed.txt; exit 1; fi
          test -s apps/website/src/lib/courseChat.gen.ts
          test -s emit-out/workflow/emit-course-chat.yml

      # test-report prints FAIL <name>, FAIL <n>, BLOCKED <why> and tests <n>; a spec with no test is no proof
      - name: Gate, every test passed
        run: |
          grep -E '^  (FAIL  [^ ]|BLOCKED|FAIL +[1-9]|tests +0$)' emit-out/logs/test-report.log || true
          if grep -qE '^  (FAIL  [^ ]|BLOCKED|FAIL +[1-9]|tests +0$)' emit-out/logs/test-report.log; then exit 1; fi
          cat emit-out/logs/test-report.log

      # FR-208: each planted bug must turn the suite red on its own test, and the copy must differ from the spec
      - name: Gate, each planted bug turns its own test red
        run: |
          grep -qE '^  FAIL  limit_per_ip_per_hour' emit-out/logs/bug-ip.log
          grep -qE '^  FAIL  limit_per_key_per_day' emit-out/logs/bug-key.log
          grep -qE '^  FAIL  limit_global_per_day' emit-out/logs/bug-global.log
          grep -qE '^  FAIL  limit_turns_per_conversation' emit-out/logs/bug-turns.log
          grep -qE '^  FAIL  never_a_paid_fallback' emit-out/logs/bug-paid.log
          grep -qE '^  FAIL  opener_is_a_circle_with_the_avatar' emit-out/logs/bug-round.log
          grep -qE '^  FAIL  opener_is_a_fifth_larger_and_a_tap_target' emit-out/logs/bug-tap.log
          grep -qE '^  FAIL  a_message_is_kept_in_every_state' emit-out/logs/bug-send.log
          grep -qE '^  FAIL  an_offline_probe_says_offline_not_busy' emit-out/logs/bug-probe.log
          grep -qE '^  FAIL  send_is_a_real_button_with_a_tap_target' emit-out/logs/bug-gosize.log
          grep -qE '^  FAIL  opener_keeps_a_margin_from_every_edge_and_the_notch' emit-out/logs/bug-notch.log
          grep -qE '^  FAIL  the_open_sheet_fits_the_visible_viewport' emit-out/logs/bug-dvh.log
          grep -qE '^  FAIL  close_is_a_tap_target' emit-out/logs/bug-close.log
          grep -qE '^  FAIL  motion_stops_when_the_reader_asks_for_less' emit-out/logs/bug-reduce.log
          grep -qE '^  FAIL  the_avatar_is_inside_the_chat' emit-out/logs/bug-avhead.log
          grep -qE '^  FAIL  opening_is_one_motion' emit-out/logs/bug-grow.log
          for n in ip key global turns paid round tap send probe gosize notch dvh close reduce avhead grow; do if grep -qE '^  BLOCKED' "emit-out/logs/bug-$n.log"; then exit 1; fi; if cmp -s apps/website/specs/chat/course-chat.t27 "emit-out/negative/$n.t27"; then exit 1; fi; done

      # the committed module is the emitted one, byte for byte
      - name: Gate, the committed module equals the emitted one
        run: |
          git status --porcelain -- apps/website/src/lib/courseChat.gen.ts
          test -z "$(git status --porcelain -- apps/website/src/lib/courseChat.gen.ts)"

      # the committed workflow is the emitted one, byte for byte; a hand edit must be seen
      - name: Gate, the committed workflow equals the one its spec writes
        run: |
          cmp emit-out/workflow/emit-course-chat.yml .github/workflows/emit-course-chat.yml
          cp .github/workflows/emit-course-chat.yml emit-out/negative/edited.yml
          echo '# edited by hand' >> emit-out/negative/edited.yml
          if cmp -s emit-out/workflow/emit-course-chat.yml emit-out/negative/edited.yml; then exit 1; fi
