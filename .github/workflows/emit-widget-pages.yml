name: Emit the static widget pages (t27c gen-text)

# FR-106 of gHashTag/trinity#1807: the 27 widget pages of course 12, "Vibecoding from zero", are written
# by the specs in apps/website/specs/widgets/views/, not by hand. Each spec has a pub fn page_<id> that
# fills a buffer with the whole HTML page; `t27c gen-text --fn` compiles the spec (with the `use`d html_out
# writer and page_kit frame), runs the fn and writes its bytes, unchanged, to
# apps/website/public/widgets/<id>/index.html. The Mac never runs t27c, so this job is the lab: it
#   1. builds t27c from the pinned t27 revision and sets up the Zig that t27 runs its harness with,
#   2. runs the tests of every view spec (test-report prints its verdicts; this job reads what it prints),
#   3. emits all 27 pages and uploads them as the artifact "widget-pages" (to commit by hand, because a
#      push made with GITHUB_TOKEN starts no workflow),
#   4. fails when a page did not emit, a test did not pass, or a committed page differs from the emitted one.
# The shell lines below are plumbing around t27c, one tool call per line; the pages themselves are t27.

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/website/specs/widgets/views/**"
      - "apps/website/public/widgets/vc-*/**"
      - ".github/workflows/emit-widget-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emit-widget-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # The t27 revision whose t27c has gen-text --fn: the merge of gHashTag/t27#13568.
  T27_EMITTER_REVISION: 06522649ba5006c206d89af4c70c45590461a691
  T27_ZIG_VERSION: 0.16.0

jobs:
  emit:
    name: Emit the 27 pages and test the views
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check out gHashTag/t27 at the emitter revision
        uses: actions/checkout@v4
        with:
          repository: gHashTag/t27
          ref: ${{ env.T27_EMITTER_REVISION }}
          path: t27-pinned
          fetch-depth: 1

      # plumbing: build the compiler from that revision with its own Cargo.lock
      - name: Build t27c
        run: cargo build --release --locked -p t27c --manifest-path t27-pinned/Cargo.toml --target-dir t27c-target

      - name: Setup the Zig that t27 runs its harness with
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.T27_ZIG_VERSION }}
          use-cache: false

      # plumbing: put t27c on the PATH, make the output folders
      - name: Put t27c on the PATH
        run: |
          echo "$PWD/t27c-target/release" >> "$GITHUB_PATH"
          mkdir -p emit-out/logs

      # plumbing: one test-report per spec; it prints its verdicts and the next step reads them
      - name: Test every view spec
        run: for f in apps/website/specs/widgets/views/*.t27; do t27c test-report "$f" --specs-dir apps/website/specs; done > emit-out/logs/test-report.log 2>&1 || true

      # plumbing: one gen-text line per page; a page that did not emit is named in failed.txt
      - name: Emit the 27 pages
        run: |
          t27c gen-text apps/website/specs/widgets/views/vc-agent-hands.t27 --fn page_vc_agent_hands -o apps/website/public/widgets/vc-agent-hands/index.html || echo vc-agent-hands >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-agent-memory.t27 --fn page_vc_agent_memory -o apps/website/public/widgets/vc-agent-memory/index.html || echo vc-agent-memory >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-agent-mind.t27 --fn page_vc_agent_mind -o apps/website/public/widgets/vc-agent-mind/index.html || echo vc-agent-mind >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-branch.t27 --fn page_vc_branch -o apps/website/public/widgets/vc-branch/index.html || echo vc-branch >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-commit.t27 --fn page_vc_commit -o apps/website/public/widgets/vc-commit/index.html || echo vc-commit >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-describe-run-check.t27 --fn page_vc_describe_run_check -o apps/website/public/widgets/vc-describe-run-check/index.html || echo vc-describe-run-check >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-editor-agent.t27 --fn page_vc_editor_agent -o apps/website/public/widgets/vc-editor-agent/index.html || echo vc-editor-agent >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-four-phases.t27 --fn page_vc_four_phases -o apps/website/public/widgets/vc-four-phases/index.html || echo vc-four-phases >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-honest-plan.t27 --fn page_vc_honest_plan -o apps/website/public/widgets/vc-honest-plan/index.html || echo vc-honest-plan >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-key-pair.t27 --fn page_vc_key_pair -o apps/website/public/widgets/vc-key-pair/index.html || echo vc-key-pair >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-measure.t27 --fn page_vc_measure -o apps/website/public/widgets/vc-measure/index.html || echo vc-measure >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-message-loop.t27 --fn page_vc_message_loop -o apps/website/public/widgets/vc-message-loop/index.html || echo vc-message-loop >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-myth-tests.t27 --fn page_vc_myth_tests -o apps/website/public/widgets/vc-myth-tests/index.html || echo vc-myth-tests >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-own-spec.t27 --fn page_vc_own_spec -o apps/website/public/widgets/vc-own-spec/index.html || echo vc-own-spec >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-plant-bug.t27 --fn page_vc_plant_bug -o apps/website/public/widgets/vc-plant-bug/index.html || echo vc-plant-bug >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-prompt-example.t27 --fn page_vc_prompt_example -o apps/website/public/widgets/vc-prompt-example/index.html || echo vc-prompt-example >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-prompt-parts.t27 --fn page_vc_prompt_parts -o apps/website/public/widgets/vc-prompt-parts/index.html || echo vc-prompt-parts >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-read-an-error.t27 --fn page_vc_read_an_error -o apps/website/public/widgets/vc-read-an-error/index.html || echo vc-read-an-error >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-read-diff.t27 --fn page_vc_read_diff -o apps/website/public/widgets/vc-read-diff/index.html || echo vc-read-diff >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-secrets-out.t27 --fn page_vc_secrets_out -o apps/website/public/widgets/vc-secrets-out/index.html || echo vc-secrets-out >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-small-step.t27 --fn page_vc_small_step -o apps/website/public/widgets/vc-small-step/index.html || echo vc-small-step >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-spec-to-bot.t27 --fn page_vc_spec_to_bot -o apps/website/public/widgets/vc-spec-to-bot/index.html || echo vc-spec-to-bot >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-steps-in-order.t27 --fn page_vc_steps_in_order -o apps/website/public/widgets/vc-steps-in-order/index.html || echo vc-steps-in-order >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-ten-commands.t27 --fn page_vc_ten_commands -o apps/website/public/widgets/vc-ten-commands/index.html || echo vc-ten-commands >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-test-judge.t27 --fn page_vc_test_judge -o apps/website/public/widgets/vc-test-judge/index.html || echo vc-test-judge >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-the-loop.t27 --fn page_vc_the_loop -o apps/website/public/widgets/vc-the-loop/index.html || echo vc-the-loop >> emit-out/failed.txt
          t27c gen-text apps/website/specs/widgets/views/vc-unstuck.t27 --fn page_vc_unstuck -o apps/website/public/widgets/vc-unstuck/index.html || echo vc-unstuck >> emit-out/failed.txt

      # plumbing: gather the pages (keeping their repo paths) and the sizes for the artifact
      - name: Gather the pages
        if: always()
        run: |
          cp --parents apps/website/public/widgets/vc-*/index.html emit-out/ || true
          wc -c apps/website/public/widgets/vc-*/index.html > emit-out/logs/sizes.txt || true

      - name: Upload the pages and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-pages
          path: emit-out
          if-no-files-found: warn

      - name: Gate, every page emitted
        run: |
          test -f emit-out/failed.txt && cat emit-out/failed.txt
          test ! -f emit-out/failed.txt

      # test-report prints FAIL <name>, FAIL <n>, BLOCKED <why> and tests <n>; a spec with no test is no proof
      - name: Gate, every view test passed
        run: |
          grep -E '^  (FAIL  [^ ]|BLOCKED|FAIL +[1-9]|tests +0$)' emit-out/logs/test-report.log || true
          ! grep -qE '^  (FAIL  [^ ]|BLOCKED|FAIL +[1-9]|tests +0$)' emit-out/logs/test-report.log

      # the committed pages are the emitted ones, byte for byte
      - name: Gate, the committed pages equal the emitted ones
        run: |
          git status --porcelain -- apps/website/public/widgets
          test -z "$(git status --porcelain -- apps/website/public/widgets)"
