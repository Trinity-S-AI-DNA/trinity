name: secret-scan

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Server-side twin of the lefthook secret gate (lefthook.yml): the same
  # gitleaks rules (.gitleaks.toml) over every commit the PR or push adds,
  # so a commit made with --no-verify still cannot land a credential.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan the commits this event adds
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE:-}" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            RANGE="$BASE..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts="$RANGE" .
