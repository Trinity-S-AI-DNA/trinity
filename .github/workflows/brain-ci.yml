name: S³AI Brain CI — "Functional MRI" Gate

# Managed by apps/website/scripts/ci-triggers-from-spec.mjs from specs/ci/workflow_triggers.t27.
# Do not edit this block: edit the spec, then run npm --prefix apps/website run gen:ci-triggers.
on:
  push:
    branches: [main, 'v*', 'feat/*', 'fix/*', 'refactor/*']
    # No schedule: block. The Queen (Inngest app t27-queen) dispatches this workflow
    # on '0 0 * * 0' UTC from the card specs/crons/trinity-brain-ci.t27 in gHashTag/t27.
    # The brain is Zig in src/; a website or docs change cannot move its
    # health score, and the site carries its own checks.
    paths-ignore:
      - 'apps/website/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main, 'v*']
    paths-ignore:
      - 'apps/website/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

env:
  BRAIN_HEALTH_THRESHOLD: "80"  # Minimum health score for merge
  # STRESS_TEST_THRESHOLD ("270", i.e. 270/300) is gone. Nothing ever printed a
  # score out of 300: test-brain-stress is a zig test binary, and the parser
  # read the first integer on a "Score:" line that never appeared, or "0".
  # The stress gate is now "every test in the binary passed, none leaked".

# The repository's default GITHUB_TOKEN is read-only, so every github-script
# step here that comments on the PR (health, stress, critical state) failed
# with 403 "Resource not accessible by integration". Nobody saw it while the
# health check failed first and those steps were skipped. pull-requests: write
# covers listing and posting comments on a PR; contents: read keeps checkout
# working. A PR from a fork still gets a read-only token.
permissions:
  contents: read
  pull-requests: write

jobs:
  # =========================================================================
  # Phase 0: Quick Health Check (fast feedback, runs on all commits)
  # =========================================================================
  brain-health-check:
    name: ⚡ Brain Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Checkout Trinity
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: CI gate specification and conformance
        run: node scripts/ci-gate-from-spec.mjs --check && node qa/ci-corona-pr-gate.mjs

      - name: Build TRI Binary
        run: |
          # `zig build tri` is a RUN step -- build.zig declares it as
          # "Run TRI - Unified Trinity CLI" -- so this launched the REPL with
          # stdin closed and segfaulted, while the step called itself a build.
          # `zig build` installs the binary without running it, which is what
          # a step named "Build TRI Binary" should do.
          zig build -Dci=true
          ls -la zig-out/bin/tri

      - name: Run Brain Health Check
        id: health
        run: |
          # Run health check and capture output
          ./zig-out/bin/tri stress --health 2>&1 | tee /tmp/health-output.txt || true

          # What the score is: `tri stress --health` (src/tri/brain_health.zig)
          # runs a fixed list of probes against the three brain regions linked
          # into tri -- basal_ganglia, reticular_formation, locus_coeruleus --
          # and prints exactly one plain-ASCII line
          #   Score: <n.n>/100 (<passed> of <total> probes passed)
          # where n = 100 * passed / total, followed by "Status: HEALTHY" (all
          # probes passed) or "Status: UNHEALTHY". It exits 1 on any failed
          # probe. This step ignores that exit code (`|| true`) and gates only
          # on the threshold, so a run with a few failed probes (3 of 17 is
          # 82.4) still passes here; it gets a warning annotation below.
          # The CLI Smoke Test job runs the same command without `|| true` and
          # fails on any failed probe, but it only runs after brain-unit,
          # brain-integration and brain-stress have succeeded.
          #
          # An absent measurement is not a measurement of zero.
          #
          # `grep "Score:" ... || echo "0"` used to turn "the command printed no
          # Score: line at all" into the NUMBER 0, which the threshold check
          # below then reported as "Brain health 0 below threshold 80". That
          # reads as a measured regression. It was not one: until the probes
          # above existed, `tri stress --health` printed "stress-test: TODO -
          # not implemented yet", so there was never a score to compare, and the
          # gate failed on every run for that reason alone. If the Score: line
          # ever disappears again, this step says "not measured", not "0".
          #
          # Same class as A36/A37, where an unmeasured field rendered as an FPGA
          # measurement on a public route. Report what happened, not a number
          # that was never produced.
          if ! grep -q "Score:" /tmp/health-output.txt; then
            echo "HEALTH_SCORE=" >> $GITHUB_OUTPUT
            echo "HEALTHY=unknown" >> $GITHUB_OUTPUT
            echo "::error::brain health was NOT MEASURED -- 'tri stress --health' emitted no 'Score:' line, so there is no number to compare against the threshold of $BRAIN_HEALTH_THRESHOLD. This is not a health regression. What the command actually printed:"
            sed -n '1,20p' /tmp/health-output.txt
            exit 1
          fi

          # Extract health score. Accepts an integer as well as a decimal: the
          # old pattern required "[0-9]+\.[0-9]+", so a Score: line reading
          # "Score: 92" would have parsed as empty and reached bc as an empty
          # string. A Score: line we cannot parse is also "not measured" -- it
          # is not zero either.
          #
          # Only the number directly after "Score:" on the first Score: line is
          # read. Taking the first number anywhere on the line would read "32"
          # out of a colour escape such as ESC[32m placed before "Score:".
          SCORE_LINE=$(grep -m1 "Score:" /tmp/health-output.txt || true)
          HEALTH_SCORE=$(printf '%s\n' "$SCORE_LINE" | sed -nE 's/.*Score:[[:space:]]*([0-9]+(\.[0-9]+)?).*/\1/p')
          if [ -z "$HEALTH_SCORE" ]; then
            echo "HEALTH_SCORE=" >> $GITHUB_OUTPUT
            echo "HEALTHY=unknown" >> $GITHUB_OUTPUT
            echo "::error::a 'Score:' line was present but carried no number this step could parse. This is not a health regression. The line was:"
            grep "Score:" /tmp/health-output.txt | head -5
            exit 1
          fi
          echo "HEALTH_SCORE=$HEALTH_SCORE" >> $GITHUB_OUTPUT

          # Check if healthy. Match the whole status line: a bare
          # `grep -q "HEALTHY"` also matches "UNHEALTHY".
          if grep -qx "Status: HEALTHY" /tmp/health-output.txt; then
            echo "HEALTHY=true" >> $GITHUB_OUTPUT
          else
            echo "HEALTHY=false" >> $GITHUB_OUTPUT
            echo "::warning::brain health $HEALTH_SCORE/100: at least one probe failed -- see the FAIL rows in the output above"
          fi

          # Fail if below threshold
          if (( $(echo "$HEALTH_SCORE < $BRAIN_HEALTH_THRESHOLD" | bc -l) )); then
            echo "::error::Brain health $HEALTH_SCORE below threshold $BRAIN_HEALTH_THRESHOLD"
            exit 1
          fi

      - name: Comment Health on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const score = '${{ steps.health.outputs.HEALTH_SCORE }}';
            const healthy = '${{ steps.health.outputs.HEALTHY }}' === 'true';
            const threshold = '${{ env.BRAIN_HEALTH_THRESHOLD }}';

            const emoji = healthy ? 'X' : '!';
            const status = healthy ? 'HEALTHY' : 'UNHEALTHY';
            const color = healthy ? 'green' : 'red';

            const body = `## X Brain Health Check\n\n` +
              `**Score:** ${score}/100\n` +
              `**Status:** :${color}_circle: ${status}\n` +
              `**Threshold:** ${threshold}/100\n\n` +
              `${healthy ? 'X' : 'x'} Brain is ${healthy ? 'above' : 'below'} merge threshold`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Brain Health Check')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      # "Record Health Snapshot" is gone. It ran `tri stress --record`, which
      # prints "stress-test: TODO - not implemented yet" and exits 0, and then
      # wrote "Health snapshot recorded to Hippocampus" into the job summary
      # unconditionally. Nothing was recorded; the summary line was false.

  # =========================================================================
  # Phase 1: Build Check (compile validation)
  # =========================================================================
  build-check:
    name: 🔨 Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Checkout Trinity
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build TRI Binary
        run: |
          # `zig build tri` is a RUN step -- build.zig declares it as
          # "Run TRI - Unified Trinity CLI" -- so this launched the REPL with
          # stdin closed and segfaulted, while the step called itself a build.
          # `zig build` installs the binary without running it, which is what
          # a step named "Build TRI Binary" should do.
          zig build -Dci=true
          ls -la zig-out/bin/tri

  # =========================================================================
  # Phase 2: Unit Tests — Individual Brain Regions
  # =========================================================================
  # Each entry is `zig build test-<region>`; build.zig declares the steps in
  # its "Brain CI test steps" section. #517 (42490a222) removed every one of
  # them while this matrix kept calling them, so every leg failed with "no
  # step named ..." and nothing below Unit Tests ever ran.
  #
  # Not restored, on purpose:
  # - intraparietal: src/brain/intraparietal_sulcus.zig does not compile. It
  #   is a stub (GF16 and TF3 are `f32`, PHI is 3.0) whose TF3 type exists
  #   nowhere else, wrapped around the hslm model that left this repository.
  #   A green leg would be a leg for code that cannot be built.
  # - hslm: the HSLM model moved to gHashTag/trinity-training; its tests run
  #   there. build.zig never had a test-hslm step.
  brain-unit:
    name: 🧠 Unit Tests
    runs-on: ubuntu-latest
    needs: [build-check, brain-health-check]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        region:
          - basal-ganglia
          - reticular-formation
          - locus-coeruleus
    steps:
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Checkout Trinity
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test ${{ matrix.region }}
        run: |
          # The exit code is the gate: zig build fails on any failed or leaking
          # test. --summary all prints "N/M tests passed" so the log shows how
          # many tests ran, not just that the step ended.
          zig build test-${{ matrix.region }} -Dci=true --summary all

  # =========================================================================
  # Phase 3: Integration Test — Brain Aggregator
  # =========================================================================
  brain-integration:
    name: 🔗 Integration Test
    runs-on: ubuntu-latest
    needs: brain-unit
    timeout-minutes: 10
    steps:
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Checkout Trinity
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test Brain Integration
        run: |
          # test-brain runs two binaries: src/brain/brain.zig (the aggregator
          # that re-exports every region) and src/brain/integration_test.zig
          # (cross-region scenarios; it imports metrics_dashboard.zig by path,
          # so the dashboard's own tests run in that binary too). The exit code
          # is the gate.
          zig build test-brain -Dci=true --summary all

  # =========================================================================
  # Phase 4: Stress Test — "Functional MRI" Gate
  # =========================================================================
  brain-stress:
    name: 🧪 Stress Test (Functional MRI)
    runs-on: ubuntu-latest
    needs: brain-integration
    timeout-minutes: 15
    steps:
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Checkout Trinity
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Stress Test
        id: stress
        run: |
          # What is measured: `zig build test-brain-stress` compiles
          # src/brain/stress_test.zig (10k-claim, 20k-event, concurrent and
          # edge-case tests) together with the region files it imports by path,
          # whose own tests run in the same binary. The result is the test
          # count zig prints: "Build Summary: ...; <passed>/<total> tests
          # passed[; <f> failed][; <l> leaked]".
          #
          # What used to be here: the output went through `| tee` without
          # pipefail, so a failed build still exited 0; "Score:" was grepped
          # out of output that never contains it and `|| echo "0"` turned the
          # missing line into the number 0; and the 270/300 threshold compared
          # that 0 against a scale nothing produces. As in the health step
          # above: an absent measurement is NOT MEASURED, never 0.
          set +e
          zig build test-brain-stress -Dci=true --summary all 2>&1 | tee /tmp/stress-output.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          echo "BUILD_EXIT=$BUILD_EXIT" >> $GITHUB_OUTPUT

          SUMMARY=$(grep -m1 "^Build Summary:" /tmp/stress-output.txt || true)
          TESTS_PASSED=$(printf '%s\n' "$SUMMARY" | sed -nE 's#.* ([0-9]+)/([0-9]+) tests passed.*#\1#p')
          TESTS_TOTAL=$(printf '%s\n' "$SUMMARY" | sed -nE 's#.* ([0-9]+)/([0-9]+) tests passed.*#\2#p')
          TESTS_LEAKED=$(printf '%s\n' "$SUMMARY" | sed -nE 's#.*; ([0-9]+) leaked.*#\1#p')

          if [ -z "$TESTS_PASSED" ] || [ -z "$TESTS_TOTAL" ] || [ "$TESTS_TOTAL" -eq 0 ]; then
            echo "RESULT=not-measured" >> $GITHUB_OUTPUT
            echo "::error::brain stress was NOT MEASURED -- the build summary carries no '<passed>/<total> tests passed' count (zig build exit $BUILD_EXIT), so no test result exists. This is not a score of 0. Summary line: ${SUMMARY:-<none>}"
            tail -40 /tmp/stress-output.txt
            exit 1
          fi

          echo "TESTS_PASSED=$TESTS_PASSED" >> $GITHUB_OUTPUT
          echo "TESTS_TOTAL=$TESTS_TOTAL" >> $GITHUB_OUTPUT
          echo "TESTS_LEAKED=${TESTS_LEAKED:-0}" >> $GITHUB_OUTPUT

          # The exit code is checked as well as the count: when the test binary
          # crashes (a segfault, a panic) zig can still print "N/N tests
          # passed", and only the non-zero exit says the run did not finish.
          if [ "$BUILD_EXIT" -ne 0 ] || [ "$TESTS_PASSED" -ne "$TESTS_TOTAL" ] || [ "${TESTS_LEAKED:-0}" -ne 0 ]; then
            echo "RESULT=fail" >> $GITHUB_OUTPUT
            echo "::error::brain stress FAILED: $TESTS_PASSED/$TESTS_TOTAL tests passed, ${TESTS_LEAKED:-0} leaked, zig build exit $BUILD_EXIT (a non-zero exit with every test passed means the test binary crashed -- see the log above)"
            exit 1
          fi
          echo "RESULT=pass" >> $GITHUB_OUTPUT
          echo "brain stress: $TESTS_PASSED/$TESTS_TOTAL tests passed, 0 leaked"

      - name: Comment Stress Test on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            // Every number below comes from the step outputs, i.e. from
            // zig's own build summary. The old body hard-coded a per-region
            // table of "100/100" that no step ever measured.
            const passedCount = '${{ steps.stress.outputs.TESTS_PASSED }}';
            const total = '${{ steps.stress.outputs.TESTS_TOTAL }}';
            const leaked = '${{ steps.stress.outputs.TESTS_LEAKED }}';
            const passed = '${{ steps.stress.outputs.RESULT }}' === 'pass';

            const status = passed ? 'PASS' : 'FAIL';
            const color = passed ? 'green' : 'red';

            const body = `## 🧪 Brain Stress Test Results\n\n` +
              `**Tests:** ${passedCount}/${total} passed, ${leaked} leaked\n` +
              `**Status:** :${color}_circle: ${status}\n` +
              `**Gate:** every test in \`zig build test-brain-stress\` passes and none leaks\n`;

            // Find or create comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Brain Stress Test')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      # `tri stress --record` is no longer called here: it is an unimplemented
      # subcommand that exits 0, and this job never built tri, so it could not
      # have run anyway. .trinity/brain_health_history.jsonl is no longer
      # uploaded as a result: nothing in CI writes it; the checked-in copy is a
      # one-line snapshot from 2026-03-20.
      - name: Stress Test Summary
        if: always()
        run: |
          echo "## 🧪 Stress Test Output" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -60 /tmp/stress-output.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "no stress output was produced" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Stress Test Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-stress-results
          path: /tmp/stress-output.txt
          retention-days: 30

  # =========================================================================
  # Phase 5: CLI Smoke Test — Verify Commands Work
  # =========================================================================
  cli-smoke:
    name: 💨 CLI Smoke Test
    runs-on: ubuntu-latest
    needs: brain-stress
    timeout-minutes: 5
    steps:
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Checkout Trinity
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build TRI Binary
        run: |
          # `zig build tri` is a RUN step -- build.zig declares it as
          # "Run TRI - Unified Trinity CLI" -- so this launched the REPL with
          # stdin closed and segfaulted, while the step called itself a build.
          # `zig build` installs the binary without running it, which is what
          # a step named "Build TRI Binary" should do.
          zig build -Dci=true
          ls -la zig-out/bin/tri

      - name: CLI Commands Test
        run: |
          # Only commands that measure something are run here, and none is
          # wrapped in `|| true`.
          #
          # `tri stress --health` runs the 17 brain probes and exits 1 if ANY
          # probe fails -- stricter than the health job, which gates on the
          # score threshold.
          #
          # Dropped, because each one prints "<name>: TODO - not implemented
          # yet" and exits 0, so calling it tested only that the binary starts:
          #   tri task stats, tri task list   (task-claim)
          #   tri event stats                 (event-stream)
          #   tri stress --scan               (stress-test; only --health exists)
          # Add them back when they do something.
          ./zig-out/bin/tri stress --health

  # Phase 6 "Export Brain Metrics" is gone. Its only measuring step was
  # `tri stress --metrics`, which prints "stress-test: TODO - not implemented
  # yet" and exits 0, and its artifact was the checked-in
  # .trinity/brain_health_history.jsonl, which nothing in CI writes. It ran
  # with `if: always()`, so it reported success even when every job above it
  # had failed. Re-add it when `tri stress --metrics` exports something.

  # =========================================================================
  # Final Gate: Brain Health Report
  # =========================================================================
  brain-health-report:
    name: 📋 Brain Health Report
    runs-on: ubuntu-latest
    needs: [brain-health-check, build-check, brain-unit, brain-integration, brain-stress, cli-smoke]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Checkout Trinity
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate Health Report
        env:
          BRAIN_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-gate-from-spec.mjs --check && node scripts/ci-brain-gate.mjs

      # On a push there is no PR, so context.issue.number is undefined and the
      # call becomes POST /repos/.../issues//comments -> 404.
      #
      # This is NOT the whole reason the job goes red: the step above is an
      # aggregator and exits 1 whenever an upstream job failed, which it should.
      # But this 404 fired on top of that and buried the real verdict under a
      # 30-line octokit dump, so the log read as an API problem rather than as
      # "the health check did not pass". Guarding it removes the noise, not the
      # signal -- the aggregator still fails the job on its own.
      - name: Critical State Notification
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 🚨 CRITICAL: Brain Health Below Threshold\n\n` +
              `The brain health CI gate has failed. This PR **cannot be merged** until:\n\n` +
              `1. All brain region unit tests pass\n` +
              `2. Integration tests pass (\`zig build test-brain\`)\n` +
              `3. Every stress test passes with no leaks (\`zig build test-brain-stress\`)\n` +
              `4. Brain health score >= 80/100, and every probe passes in CLI Smoke\n\n` +
              `Please review the failed job logs and fix the issues.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  # =========================================================================
  # Weekly Trend Report (runs on schedule)
  # =========================================================================
  brain-trend-report:
    name: 📈 Weekly Brain Trend Report
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'  # the Queen dispatches the weekly run
    timeout-minutes: 10
    steps:
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Checkout Trinity
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # tri was built here only for `tri stress --record` and `--history`,
      # both unimplemented subcommands that exit 0. They and the build are
      # gone; the stress test below is the measurement.
      - name: Run Full Stress Test
        run: |
          # pipefail: without it `| tee` hid a failed stress run and the
          # weekly job went green on a red test binary.
          set -o pipefail
          zig build test-brain-stress -Dci=true --summary all 2>&1 | tee /tmp/weekly-stress.txt

      - name: Generate Trend Report
        if: always()
        run: |
          echo "# 📈 Weekly Brain Health Trend Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Stress Test Results" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          tail -60 /tmp/weekly-stress.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "no stress output was produced" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      # `with:` is not a shell, so `$(date +%Y%m%d)` was never expanded: every
      # week uploaded an artifact literally named
      # "weekly-brain-report-$(date +%Y%m%d)". The run id is unique per run.
      - name: Upload Weekly Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-brain-report-${{ github.run_id }}
          path: /tmp/weekly-stress.txt
          retention-days: 365

  # =========================================================================
  # Merge Gate (blocks merge if brain health is poor)
  # =========================================================================
  merge-gate:
    name: 🔒 Merge Gate
    runs-on: ubuntu-latest
    needs: [brain-health-report]
    # always(): without it a failed report makes this job "skipped", and a
    # skipped check is grey, not red -- on #1328 (run 37176676345) the report
    # failed and the gate showed skipped. Now it runs and the check below
    # fails it for any report result other than success.
    if: always() && github.event_name == 'pull_request'
    timeout-minutes: 2
    steps:
      - name: Check Merge Eligibility
        run: |
          # All previous jobs must have passed
          if [ "${{ needs.brain-health-report.result }}" != "success" ]; then
            echo "::error::Merge gate blocked: Brain health checks failed"
            echo "PR cannot be merged until brain health is restored."
            exit 1
          fi

          echo "X Merge gate passed: Brain health is acceptable"
          echo "This PR is eligible for merge."
