# The three checks that exist and never run.
#
# anomaly-register A48: this project does not fail by missing things. Its site
# audit, its claim-guard and its five-label framework all caught the same
# overclaims -- and every one of them failed at the step AFTER the finding. The
# audit was written, then deleted, and the numbers stayed for six months.
#
# So these run on every PR that touches the site. Each was written the day its
# failure was found and each has been run by hand since, which is another way
# of saying each has been forgotten at least once.
#
#   typecheck:ratchet  errors may fall, never rise (A31: `npm run build` claimed
#                      to typecheck, never ran in the deploy path, and 231
#                      errors accrued unseen -- among them seven React branches
#                      that were statically false, so four panels rendered
#                      nothing in production)
#   check:api          a field the UI formats that no server emits, and any
#                      fallback not tagged with sample() (A36/A37: novelty:0.342
#                      rendered as an FPGA measurement on a public route)
#   audit:mobile       no route scrolls sideways at 375px (A50: /specs kept its
#                      desktop two-pane layout on a phone, leaving ~150px for
#                      the detail; nothing was checking the other 27 routes, and
#                      /dashboard was over by 13px)
#   check:silicon      every spec naming a silicon-verified format is classified
#                      -- mapped, family, or excluded WITH a reason (A44: the
#                      corpus carries the GF ladder three times, the first table
#                      listed one root, and twelve specs describing formats
#                      measured on silicon rendered "No hardware run")
#   check:render       real Chrome over CDP, every panel on all nine canvas
#                      layers, fails on the first uncaught error (A39: vite
#                      build was green through all of the above -- it proves
#                      the bundler succeeded, not that the page renders)
name: Website checks

# apps/queen-proxy/** is in the triggers because one of the gates below reads
# it. The proxy is the server half of the rule that only registered people
# write to the Queen, and a proxy-only edit that removed the gate would
# otherwise touch no watched path and run no check at all. The five src/tri and
# src/registry files are in for the same reason: check:tools-coverage re-reads
# the dispatcher, and a new `tri` command must not land without its card.
on:
  pull_request:
    paths: ['apps/website/**', 'apps/queen-proxy/**', '.github/workflows/website-checks.yml', 'src/tri/main.zig', 'src/tri/tri_namespace.zig', 'src/tri/tri_utils.zig', 'src/registry/command_table.zig', 'src/tri/tri_register.zig']
  push:
    branches: [main]
    paths: ['apps/website/**', 'apps/queen-proxy/**', 'src/tri/main.zig', 'src/tri/tri_namespace.zig', 'src/tri/tri_utils.zig', 'src/registry/command_table.zig', 'src/tri/tri_register.zig']
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # render-check uses the WebSocket client built into 22
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - run: npm ci

      # Every aria-controls / aria-labelledby / aria-describedby resolves to an
      # id that is actually declared. A dangling aria-controls="mobile-menu" sat
      # in the tree until this was written.
      - name: ARIA references resolve
        run: npm run check:aria

      # Not a gate on the count, a gate on the DIRECTION, and per file: a scalar
      # total passes when one file is fixed and another breaks by the same
      # amount. --selftest first, so a gate nobody has watched fail is not
      # trusted on the day it matters. 184 across 27 files today.
      - name: the ratchet can fail
        run: npm run typecheck:ratchet -- --selftest
      - name: typecheck ratchet
        run: npm run typecheck:ratchet && npm run check:queen-evidence

      # Compares names only -- it cannot see units, which is why A34's five
      # mappable fields stay unwired rather than relabelled as microseconds.
      - name: API contract
        run: npm run check:api

      # Runs its own --self-test first: it injects an unclassified gf16 path and
      # requires the detector to report it, so the gate cannot pass by looking
      # at nothing. It reads the real tables by compiling siliconHistory.ts,
      # not by pattern-matching its source.
      - name: Silicon coverage
        run: npm run check:silicon

      # The three catalogs behind the Explorer tabs. Each is generated from an
      # artifact -- the spec corpus, the skill files, the source of every
      # scheduled job -- so each gets a gate that re-reads the artifact rather
      # than trusting the committed JSON.
      - name: Skill catalog
        run: npm run check:skills-catalog
      - name: Cron catalog
        run: npm run check:crons-catalog
      # The tools catalog's gate (check:tools) asks the generator's questions and
      # is red on main for an unrelated reason, so it runs nowhere. This one asks
      # only whether the site can open every card: schema 2 added a witness and
      # qualified ids the site did not know, and the Queen's Tools tab was blank.
      - name: Tool cards open on the site
        run: npm run check:tools-site
      # Every command of the three tri programs (qa/tri-commands/) has a card, and
      # a published recording reaches the card of the command it ran.
      - name: Every tri command has a card
        run: npm run check:tools-coverage && npm run test:tri-commands
      # The console reads one person's correspondence in a browser tab. This
      # asserts the four properties that keep that from being a leak: no service
      # key anywhere under src/, exactly one identity header per request, three
      # endpoints only, and no tool that can send.
      - name: Clients console cannot send
        run: npm run check:clients-console
      # The Explorer pages carry their own en/ru dictionaries instead of the
      # site catalogues, and a locale that gains a key alone rots silently.
      - name: Explorer languages
        run: npm run check:explorer-languages
      # The same build is served at t27.ai/ and under app.t27.ai/game/. A
      # root-absolute URL resolves to the other app's root under the subpath,
      # so every URL in src/, messages/ and the manifest is relative, https://t27.ai/...,
      # or a hash route. Proves its detector on a fixture first.
      - name: Subpath-safe URLs
        run: npm run check:subpath-urls
      # The Queen's TRI tab frames app.t27.ai: every frame URL keeps that
      # origin, the address round-trips its screen, and only the app's own
      # messages from its own frame are heard. Pure, no browser.
      - name: TRI screens
        run: npm run check:tri
      # Who is playing, without holding the player's session: replies only from
      # app.t27.ai and from the window asked, with its nonce; the game token in
      # memory only; whoami never carries X-Agent-Key. Pure, no browser.
      - name: TRI identity
        run: npm run check:tri-identity
      # The TOKEN tab counts TRI by the leaderboard (owner, 2026-10-03): spec
      # commits per author plus accepted .t27 specs per lane, times the
      # ledger's rate, one row per GitHub account. Pure, no browser.
      - name: TRI board
        run: npm run check:tri-board
      # MINE TRI on the landing: the "Copy to agent" prompt says testnet, no
      # price, NOT trustless, asks the human before a PR and never prints a
      # rate the ledger did not state; the block reads its figures. Pure.
      - name: TRI mine
        run: npm run check:tri-mine
      # The PROVIDERS tab re-reads the Gonka chain in the browser. Recorded
      # responses rebuilt from the model cards must come back with zero
      # differences, each bent value alone; a host's address, seed or key never
      # leaves the parser, and the page sends nothing to a model. Pure, no network.
      - name: Providers (Gonka live read)
        run: npm run check:providers
      # The Queen's kanban grew a second lane, and it is the first thing on that
      # page that differs per person. Signed in, it asks the hive for the
      # clients this visitor answers for — on the game token, one identity
      # header, no cookies, and without the tool's `client` argument, so a
      # control on the page can narrow what arrived but never ask for somebody
      # else. Signed out, the markup is the public board's and nothing more: no
      # lane, no count, not even a label. Asserted against the real modules and
      # the page parsed with the real parser. Pure, no browser.
      - name: Hive board is per person
        run: npm run check:hive-board
      # The third lane is the owner's MAIL by client, whose move it is. Who
      # may see it is the render service's decision (the owner, and whoever
      # the owner granted it to); this holds that the page sends no argument
      # to widen it, reads no count, draws NO lane when the mail was not sent,
      # keeps only github links, and puts the lane, its heading and its chip
      # behind `{ball && …}`.
      - name: The mail lane is the owner's, or granted
        run: npm run check:ball-board
      # The lane's filter can watch several clients at once and search within
      # them, which is two more ways for a control to describe rows the server
      # did not send. One property over every hostile input anyone has thought
      # of: the cards drawn are a SUBSET of the cards that arrived, and the
      # request count does not move however many times the board is filtered.
      - name: The clients filter can only ever hide
        run: npm run check:clients-filter
      # The task lane grew the same kind of control, over what a card is ABOUT
      # rather than whose it is, and it is held to the same property: the cards
      # drawn are a SUBSET of the cards that arrived, for every selection
      # including ones no reader can produce. The second half is the colours.
      # The wire carries no labels, so direction is read from the title the page
      # was already sent -- which means a card that said nothing, like the bare
      # `#1234` the hive sends for finished work, must come out `other` and not
      # be quietly painted as code. A colour is read as a fact. Pure, no browser.
      - name: The direction filter can only ever hide
        run: npm run check:queen-direction
      # The Queen board moved to app.t27.ai/queen/, and #/queen here hands its
      # visitors over. app.t27.ai builds THIS bundle, so the redirect code runs
      # at the destination too: keyed on the route alone it would send that page
      # to itself for ever, and the board would be unreachable at the only
      # address that serves it. The gate calls the decision with both origins as
      # input and re-feeds every answer to prove it settles. Pure, no browser.
      - name: Queen board moved
        run: npm run check:queen-redirect
      # The other half of that move. At the destination the bridge above is not
      # merely unnecessary, it is impossible: rule 1 is false off t27.ai, the
      # bridge answers only a t27.ai parent, and nginx serves it with
      # frame-ancestors https://t27.ai and never 'self'. So the redirect alone
      # would have handed every visitor a board they could never sign in to.
      # On app.t27.ai/queen/ the bundle is same-origin with the player and
      # reads its session directly -- which is a stronger credential than the
      # game token, so this holds it to the same rules and to one more: an
      # empty store is signed OUT, not broken. Pure, no browser.
      - name: Identity at the board's new home
        run: npm run check:app-session-identity
      # The person's own remote browser as a view: a preview never touches a
      # pod, reading never opens one, the token rides only in a header, and
      # only our own /live/ is framed. Pure, no browser.
      - name: The BROWSER view
        run: npm run check:queen-browser
      # Signed out, the same view says what it does once signed in and names
      # the address's spec only if it is a plain path the Explorer accepts;
      # every line of the guide is pinned to the code that makes it true, and
      # every pin has a negative control. Reads public/t27/manifest.json.
      - name: The BROWSER guide, signed out
        run: npm run check:queen-browser-guide
      # The agent on BROWSER is told the address's spec only when it names one
      # catalog entry -- path, module and card from the catalog, never the
      # address's own words or the entry's free-text description. Pure, no browser.
      - name: The BROWSER agent hears which spec the page shows
        run: npm run check:queen-browser-page
      # The chat on SPECS names the spec the frame shows (one rule,
      # lib/queenEmbed.ts specsCardShown), and only a path the guide would print
      # goes into the Queen's prompt. Pure, no browser.
      - name: The SPECS chat names the spec on show
        run: npm run check:queen-specs-chat
      # Invite to watch: the render's read-only watch links on the live bar.
      # The session token rides only in a header, a minted address is shown
      # only if it is https://<host>/watch/<token> and revoked on the spot if
      # it is not, an id that is not one is never sent, and a sixth link is
      # never asked for. Pure, no browser.
      - name: Invite to watch
        run: npm run check:queen-watch
      # Tasks side by side: a card is one more lane of the person's agent in a
      # window of its own; the chat never names a lane, a render that answered
      # from main is believed, and two lanes' steps never fold. Pure, no browser.
      - name: Browser tasks side by side
        run: npm run check:queen-browser-lanes
      # The runner cabinet: the session token rides only in a header with
      # credentials omitted, a runner token is shown once and kept nowhere, and
      # the page has no field for a provider key. Pure, no browser.
      - name: The runner cabinet
        run: npm run check:queen-runners
      # What that identity is FOR. The owner's rule, 2026-09-20: only registered
      # people write to the Queen. The gate that holds it is the proxy's, not
      # this bundle's -- a rule shipped in a public bundle is a suggestion -- and
      # it asks the one service that holds the signing key rather than keeping a
      # second copy of it. Both halves run here: the proxy's decision table
      # against a fake verifier, and the panel that shows a sign-in link instead
      # of an input nobody can send from. Pure, no browser, no network.
      - name: Only registered people write to the Queen
        run: npm run check:queen-chat-gate
      # The Queen's panel is three tabs: her conversation, the board's log with
      # a filter over it, and the agents' network. Two of them are arithmetic
      # over the feed and this runs that arithmetic -- including the decision
      # that no chip lit means every kind, which read the other way opens the
      # tab on an empty list and tells the reader the swarm is idle. The third
      # holds the ceiling on what the network may claim: the wire carries an
      # issue on every row and no agent name anywhere, so the tab says so in
      # both languages instead of drawing names nobody published.
      - name: The Queen's three tabs
        run: npm run check:queen-chat-tabs
      # On BROWSER the person's own agent answers, not the Queen server whose
      # health the chat polls: the chip and the empty sentence say so, and the
      # first questions offered never ask the agent to pay, send or delete.
      - name: The Queen on the BROWSER tab
        run: npm run check:queen-browser-help
      # "it is dim" (the owner, 2026-09-21, with a photograph of the clients
      # strip). The board draws every panel over a live hive, so each colour
      # here has two contrasts and only one of them gets looked at. This does
      # the WCAG arithmetic over a field at full brightness: the tokens against
      # each ground, and every hand-written ground in the file. Before it, the
      # filter chips measured 1.6:1.
      - name: The HUD can be read while the map is lit
        run: npm run check:queen-contrast
      # The colour written beside a token is only reached where the token is
      # unknown, so a fallback that disagrees with the declaration is a number
      # the screen never paints -- and the contrast gate above reads the source.
      # One such line made it report 1.74:1 for ink drawing at 1.53:1. This
      # asserts every fallback agrees with SOME declaration of its token; where
      # it does not, the value is wrong in every scope it could be reached from.
      # Pure, no browser.
      - name: A fallback says what the token says
        run: npm run check:queen-fallback-parity
      # Why free bees are idle, read from /queen/status alone: real snapshots
      # and malformed ones through the pure reader, no fabricated zeros, a
      # stale round called stale. Pure, no browser.
      - name: Queen idle reason
        run: npm run check:queen-idle
      # The map's camera: a close-up of every cell stays readable at three
      # viewports, and also on a field eight times wider, because zoom is
      # relative to the whole field and the catalogue keeps growing. A fixed
      # ceiling of 128 broke this once the scan found an eleventh repository,
      # and the nightly t27 world scan -- the only place these ran -- then
      # failed for three nights. Pure, no browser.
      - name: Queen map close-ups stay readable
        run: npm run check:queen-displays && npm run check:queen-continuous && npm run check:queen-issue-proof && npm run check:queen-worlds
      # The PASSPORT argues a result is worthless without the record of how it
      # was taken, so its own figures must not drift from its own prose: every
      # plotted quantity carries the literal the text prints for it, in both
      # languages; the † counts are derived from the table, not typed beside it;
      # and the seven-record survey keeps its shape, including the finding that
      # the control is the only column with no absent field. Pure, no browser.
      - name: Passport figures
        run: npm run check:passport
      # Every Queen tab shows one spec corpus: the manifest, the universe atlas,
      # the shared core and the five spec-* ladders describe one scan; only
      # src/lib/queenCorpus.ts reads the corpus files; the store fetches a part
      # once for the whole window tree; a tab switch keeps spec= and world=.
      # Each of those is also fed a broken fixture that must fail. Pure here;
      # the same contract reads the built page below with --browser.
      - name: Queen spec corpus is one corpus
        run: npm run check:queen-spec-sync
      # The HUD's honesty pins: the round line, the copied bootstrap, the 24h
      # windows, the castle and the hive's colour law, each run through the
      # pure function or pinned to the line that makes it true. No workflow ran
      # this file from #897 until this step, and three pins went stale unseen:
      # 9316e9edd removed the round button one of them held, and #1206 moved
      # the two corpus reads the other two named into the store above.
      # Pure, no browser.
      - name: Queen HUD honesty
        run: npm run check:queen-honesty
      - name: Catalog generators
        run: npm run test:sync-skills && npm run test:sync-crons
      # The tiers, the touch minimum and the QA matrix come from
      # specs/ui/viewport.t27 through the compiler; the two generated files
      # must be the ones the vendored spec produces, and the generator must
      # still refuse a spec whose own tests do not hold.
      - name: Viewport spec
        run: npm run check:viewport && npm run test:viewport-spec
      # A card tap posts open-card to the app framing the board on its own
      # origin, and nowhere else (specs/automation/kanban-card-chat.t27 in t27).
      - name: Card opens its chat
        run: npm run test:card-chat
      # The agent-facing surface (/agents.t27 and /llms.txt) is generated from
      # specs/catalog/onboarding.t27 through the compiler, and the generator
      # re-compiles what it is about to publish. This step is also what keeps
      # the four consent constants from being edited into an instruction
      # addressed at somebody else's agent.
      - name: Agent onboarding spec
        run: npm run check:onboarding && npm run test:onboarding-spec
      # The X player card (public/play/) is generated from specs/x/player.t27 through the
      # compiler: X's limits on the card, the tabs the page must carry, and the site bundle
      # built from src/lib/highlight.ts. The tests also hold the RTL tab's reading of the
      # emitted Verilog to what t27c wrote for hello_world, and run every command of the
      # Term tab (public/play/shell.js) on hello_world against the spec's SHELL_* and SAY_*.
      - name: X player spec
        run: npm run check:play && npm run test:play-spec
      # The world scan's contract (specs/catalog/discovery.t27 through the compiler),
      # its pure decisions, and the manifest merge that must never touch a founding
      # source. The scan itself runs against GitHub in t27-world-scan.yml.
      - name: t27 world discovery
        run: npm run check:discovery
      # The TECH TREE draws the evolution of the .t27 language itself, so every
      # number in it has to come out of public/t27/manifest.json rather than out
      # of a literal. The gate executes the derivation against the shipped index
      # and then against a corpus a third the size, and requires the drawing to
      # move. It also holds the silicon node to what an index of specs can say.
      # Pure, no browser.
      - name: t27 evolution tree
        run: npm run check:t27-evolution

      # WARS has exactly one source of truth: specs/queen/wars.t27. These gates
      # execute its own assertions, reject unsupported or contradictory ledger
      # rows, and prove that the public .t27, JSON and TypeScript projections
      # are byte-for-byte current before Vite packages any of them.
      - name: Queen WARS experiment ledger
        run: npm run check:wars && npm run test:wars-spec

      # The WIDGETS tab: specs/widgets/gallery.t27 names what a reader can lift
      # out and share; the generator reads each widget's own page for its words
      # and card, so a widget whose page is gone fails here.
      - name: Queen WIDGETS gallery
        run: npm run check:widgets && npm run test:widgets-spec

      # The widget tools: each specs/widgets/<id>.t27 writes its own page under
      # public/widgets/<id>/ (og card, words, the spec copy), runs its own test
      # blocks, and must declare that it sends the reader's data nowhere.
      - name: Widget tool pages
        run: npm run check:widget-pages && npm run test:widget-pages

      # The courses: specs/course/courses.t27 names them in order (FPGA at
      # #/course, AI numbers at #/ai-numbers), 27 lessons each over the gallery's
      # widgets; the generator refuses a lesson whose widget is gone, a gallery
      # widget no lesson uses, a lesson spec that does not compile clean, and a
      # Russian field (i18n/<id>.ru.json, contract specs/course/<id>-ru.t27)
      # that is missing or changes a number. A crawler drops the '#', so every
      # lesson also has a static page with its own preview card at /learn/<id>/
      # and /ru/learn/<id>/, and every course a landing at its share path; the
      # check refuses a page, card or learn/sitemap.xml that lags the specs.
      - name: Course
        run: npm run check:course && npm run test:course && npm run check:course-pages && npm run check:course-recipe

      # The IGLA board on WARS: specs/queen/igla_board.t27 is generated in
      # gHashTag/igla-coder-gpu from committed artifacts. The gate recompiles it,
      # re-derives every McNemar p from its discordants, and proves the public
      # .t27, JSON and TypeScript projections are current.
      - name: IGLA board on WARS
        run: npm run check:igla-board

      # LEVEL II on the ROADMAP tab: the raid, honey, bosses, cracks and the
      # round's pulse. The raid list is pinned here and in gHashTag/t27's
      # feed_roadmap.py, so the page and the feeder raid the same sector.
      - name: Roadmap game rules
        run: npm run check:roadmap-game

      # What a link to t27.ai says in a chat preview: the name, the caption and
      # the description, from lib/motto.ts -- in the head tags, in the i18n
      # provider that rewrites them after load, and in og/og-image.svg.
      - name: Link preview words
        run: npm run check:og-preview

      - name: Build
        run: npx vite build

      # What a crawler reads on the home page before any script runs: the
      # lib/motto words GameHero renders, and absolute links to every static
      # section. After the build, so the shell is checked in dist/ as shipped.
      - name: Home page shell a crawler reads
        run: npm run check:boot-shell

      # Skips itself if no Chrome is found rather than failing: a missing
      # browser is an environment fact, not a defect in the change.
      - uses: browser-actions/setup-chrome@v1
        id: chrome

      # The WARS view must own its scrolling at desktop and phone widths and
      # must remain stable with reduced motion. The build above is the exact
      # artifact this browser contract inspects. The other Queen views are not
      # claimed here: main fails its own matrix on them (the comb embedded nine
      # levels deep, the head row overflowing at 1272-1280, the hive display
      # cut by its own boxes), so VIEWS in the contract is scoped to wars until
      # the HUD is re-laid-out -- then the whole shell comes back.
      - name: Queen viewport matrix
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run check:queen-viewport -- --no-build

      # The same contract on the built page: every Queen tab's root, the SPECS
      # rung and the Explorer frame report one data-corpus-version, the manifest
      # is fetched once between shell and frame, and world= in the shell's
      # address narrows the frame to that world's count on the comb.
      - name: Queen spec corpus, every tab
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run check:queen-spec-sync -- --browser --no-build

      # Проверяет все маршруты в обеих локалях. Скрипты имеют собственные
      # самотесты и используют Chrome через CDP без новой зависимости npm.
      - name: Language audits
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          npm run audit:en -- --selftest
          npm run audit:ru -- --selftest
          python3 -m http.server 4173 --directory dist >/tmp/t27-language-audit-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null
          AUDIT_BASE_URL='http://127.0.0.1:4173/index.html?lang=en' npm run audit:en
          AUDIT_BASE_URL='http://127.0.0.1:4173/index.html?lang=ru' npm run audit:ru
          # Same server, same Chrome harness, one more question: does any route
          # scroll sideways at 375px. Runs its own --selftest first.
          npm run audit:mobile -- --selftest
          # Both locales: the Russian chrome is wider than the English, and the
          # /specs language switcher was pushed off a 375px screen in RU while
          # fitting in EN. A single-locale run would have passed it.
          AUDIT_BASE_URL='http://127.0.0.1:4173/index.html' npm run audit:mobile
          AUDIT_BASE_URL='http://127.0.0.1:4173/index.html?lang=ru' npm run audit:mobile

      - name: Render check
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run check:render -- --no-build

      # The landing in a browser that cannot create a WebGL context, and in one
      # whose engine is refused after the probe: the page must render whole and
      # only the scene may go. On 2026-10-03 a GPU-less Chromium got a blank
      # t27.ai/ from one uncaught "WebGL not supported". Skips itself without
      # Chrome.
      - name: Landing without WebGL
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run check:home-no-webgl -- --no-build

      # The five explorers and the spec explorer at every size in the spec's
      # matrix: one pane on a phone, two above, the deep-linked card open and
      # on screen, 44px controls where a finger is the pointer, one scroller
      # per pane, nothing sideways. Skips itself without Chrome.
      - name: Explorer viewport contract
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run check:explorer-viewport -- --no-build

      # Real touch events through CDP on the built board: a tap selects a unit,
      # a drag pans, two fingers zoom. It exits 2 (NOT MEASURED) when the page
      # does not answer a probe in 20 s, which on a runner is a failure too.
      - name: Queen touch contract
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run check:queen-touch -- --no-build

      # A51: four PRs merged, every check green, and the live site changed
      # nothing -- this app deploys from a second repository that holds build
      # output only, copied there by hand. Every check above runs against the
      # source, so all of them pass on a tree whose output nobody published.
      #
      # This one fetches t27.ai and compares the entry bundle. It never fails
      # the job: a merge is not a deploy, and blocking one on the other
      # inverts the order. It is here so the gap is visible in the log rather
      # than discovered a week later in the site's <head>.
      - name: Is the live site this build?
        continue-on-error: true
        run: npm run check:deployed

      # Last, because it rebuilds dist/ against an address that refuses every
      # connection: with the API dead, no tile may show a bare number and the
      # pill may never read LIVE. It went red on main and nobody saw,
      # because only a person running it by hand on a laptop could.
      - name: Queen with a dead API
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run check:queen-dead-api
