name: Main red watch

# Does any workflow sit red where nobody is looking? The docs-check gate failed
# every docs-touching pull request from 2026-10-24 to 2026-10-26 and nothing
# noticed, because its paths filter kept it off main and its red runs lived on
# PR branches (trinity#1761's class of silence). The rules live in the cron card
# specs/crons/trinity-main-red-watch.t27 (gHashTag/t27); this file is the thin
# host, in the POST_DIR precedent of pr-blog-report.yml: read the rules from the
# card, keep no logic of your own. A clean day prints one line and touches
# nobody; a finding opens one issue that names the workflow and its run.

on:
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Find workflows that sit red
        run: |
          set -euo pipefail
          NOW=$(date +%s)
          FINDINGS=$(mktemp)
          # Rule 1 (card): a workflow whose newest run on main concluded failure.
          # Rule 2 (card): a workflow whose newest pull_request run concluded
          # failure more than 24 hours ago -- the stale PR-branch red the
          # paths-filtered gates produce.
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" --paginate \
            -q '.[] | [.id, .name, .path] | @tsv' |
          while IFS="$(printf '\t')" read -r wid wname wpath; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wid/runs?branch=main&per_page=1" \
              -q ".workflow_runs[0] | select(.conclusion == \"failure\") | \"MAIN RED: $wname ($wpath) — \" + .html_url" >> "$FINDINGS" || true
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wid/runs?event=pull_request&per_page=1" \
              -q ".workflow_runs[0] | select(.conclusion == \"failure\" and ($NOW - (.run_started_at | fromdateiso8601) > 86400)) | \"STALE PR RED (>24h): $wname ($wpath) — \" + .html_url" >> "$FINDINGS" || true
          done
          if [ -s "$FINDINGS" ]; then
            sort -u "$FINDINGS" > findings.md
            printf '# Red watch %s\n\nWorkflows sitting red where nobody looked. Rules: specs/crons/trinity-main-red-watch.t27 (gHashTag/t27).\n\n' "$(date -u +%F)" | cat - findings.md > body.md
            gh issue create --title "Red watch $(date -u +%F): workflows sitting red" --body-file body.md
            echo "findings:"; cat findings.md
          else
            echo "clean: no workflow sits red (rules in specs/crons/trinity-main-red-watch.t27)"
          fi
