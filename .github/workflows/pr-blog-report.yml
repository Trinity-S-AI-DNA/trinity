name: PR work report and blog

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to validate or recover after a failed merge dispatch'
        required: true
        type: string

# Never check out or execute the PR head in this privileged workflow.
permissions:
  contents: read

concurrency:
  group: pr-blog-report-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Load current PR metadata as data, not executable input
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > /tmp/pr.json
          python3 -c 'import json; from pathlib import Path; p=json.loads(Path("/tmp/pr.json").read_text()); Path("/tmp/event.json").write_text(json.dumps({"repository":{"full_name":p["base"]["repo"]["full_name"]},"number":p["number"],"pull_request":p}))'
      - name: Load changed files and commits as data
        run: |
          set -euo pipefail
          # Used for the Dependabot dependency-bump exemption and the course-post rule
          # (apps/website/specs/policy/course_post.t27); see scripts/pr_blog_report.py.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | {filename, status, previous_filename}' > /tmp/pr-files.jsonl
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100" \
            --jq '.[] | {sha, author: .author.login, committer: .committer.login, verified: .commit.verification.verified}' > /tmp/pr-commits.jsonl
      - name: Load changed post bodies as text (apps/website/specs/policy/post_widget.t27)
        run: |
          set -euo pipefail
          DIR=$(sed -n 's/^pub const POST_DIR : str = "\(.*\)";$/\1/p' apps/website/specs/policy/post_widget.t27)
          SHA=$(jq -er '.head.sha' /tmp/pr.json); mkdir -p /tmp/pr-posts
          jq -r --arg d "$DIR" 'select(.status != "removed" and (.filename | startswith($d) and endswith(".ts"))) | .filename' /tmp/pr-files.jsonl |
            while read -r f; do gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/$f?ref=$SHA" > "/tmp/pr-posts/${f##*/}"; done
      - name: Read the work-report bounds from the spec (specs/report/work_report.t27)
        run: |
          set -euo pipefail
          SPEC=specs/report/work_report.t27
          MIN_RESULT=$(sed -n 's/^pub const MIN_RESULT : u32 = \([0-9][0-9]*\);$/\1/p' "$SPEC")
          MIN_OUTLINE=$(sed -n 's/^pub const MIN_OUTLINE : u32 = \([0-9][0-9]*\);$/\1/p' "$SPEC")
          MAX_FIELD=$(sed -n 's/^pub const MAX_FIELD : u32 = \([0-9][0-9]*\);$/\1/p' "$SPEC")
          [[ -n "$MIN_RESULT" && -n "$MIN_OUTLINE" && -n "$MAX_FIELD" ]] || { echo "bounds missing from $SPEC"; exit 1; }
          {
            echo "WR_MIN_RESULT=$MIN_RESULT"
            echo "WR_MIN_OUTLINE=$MIN_OUTLINE"
            echo "WR_MAX_FIELD=$MAX_FIELD"
          } >> "$GITHUB_ENV"
      - name: Validate mandatory report and generate blog draft
        id: validate
        continue-on-error: true
        run: >-
          python3 scripts/pr_blog_report.py validate --event /tmp/event.json --output /tmp/pr-blog
          --files /tmp/pr-files.jsonl --commits /tmp/pr-commits.jsonl --posts /tmp/pr-posts
      - name: Bind the required status to the current PR head
        if: always()
        env:
          VALIDATION: ${{ steps.validate.outcome }}
        run: |
          set -euo pipefail
          SHA=$(jq -er '.head.sha' /tmp/pr.json)
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          STATE=failure
          DESC='Missing, stale or invalid work report; see the workflow log'
          if [ "$VALIDATION" = success ]; then
            STATE=success
            DESC='Current-head work report validated; blog draft generated'
            if jq -e '.kind == "dependency-bump"' /tmp/pr-blog/report.json > /dev/null; then
              DESC='Dependabot manifest/lockfile bump: the bump is its own report'
            fi
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$STATE" -f context='T27 work report' -f description="$DESC" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
          [ "$STATE" = success ]
      - name: Save generated report and draft
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ env.PR_NUMBER }}-blog-draft
          path: /tmp/pr-blog/
          if-no-files-found: error
          retention-days: 90
      - name: Enqueue merged PR and start its dedicated author
        run: python3 scripts/pr_blog_dispatch.py --event /tmp/event.json --draft-dir /tmp/pr-blog
