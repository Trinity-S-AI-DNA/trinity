# NeoDetect Extension Release Workflow
# Triggers on extension-specific tags (ext-v*) to avoid conflicts with other releases
#
# Every path here used to point at a top-level directory that no longer exists.
# The tree moved under deploy/trinity-nexus/ and the workflow did not move with
# it, so each step after checkout was operating on a missing directory. The
# move also dropped both manifests and all six icons -- restored from ext-v2.0.0
# in the same commit as this repoint, because a build that cannot find
# manifest.json produces a zip Chrome will not load.

name: Extension Release

on:
  push:
    tags:
      - 'ext-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 2.0.0)'
        required: true
        type: string

jobs:
  build:
    name: Build Extensions
    runs-on: ubuntu-latest
    
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Remove ext-v prefix from tag (ext-v2.0.0 -> 2.0.0)
            VERSION="${GITHUB_REF#refs/tags/ext-v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building extension version: $VERSION"
      
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Update version in package.json
        run: |
          cd deploy/trinity-nexus/extensions
          VERSION="${{ steps.version.outputs.version }}"
          jq ".version = \"$VERSION\"" package.json > tmp.json && mv tmp.json package.json
          cat package.json | grep version
      
      - name: Build WASM module
        run: |
          zig build-exe src/firebird/neodetect_wasm.zig \
            -target wasm32-freestanding \
            -O ReleaseFast \
            -fno-entry \
            -rdynamic \
            -femit-bin=deploy/trinity-nexus/extensions/chrome/wasm/neodetect.wasm
          
          cp deploy/trinity-nexus/extensions/chrome/wasm/neodetect.wasm deploy/trinity-nexus/extensions/firefox/wasm/
          
          echo "WASM built:"
          ls -la deploy/trinity-nexus/extensions/chrome/wasm/neodetect.wasm
      
      - name: Update Chrome manifest version
        run: |
          cd deploy/trinity-nexus/extensions/chrome
          VERSION="${{ steps.version.outputs.version }}"
          jq ".version = \"$VERSION\"" manifest.json > tmp.json && mv tmp.json manifest.json
      
      - name: Update Firefox manifest version
        run: |
          cd deploy/trinity-nexus/extensions/firefox
          VERSION="${{ steps.version.outputs.version }}"
          jq ".version = \"$VERSION\"" manifest.json > tmp.json && mv tmp.json manifest.json
      
      - name: Sync Firefox files
        run: |
          cd deploy/trinity-nexus/extensions
          # Copy shared files
          cp chrome/icons/*.png firefox/icons/
          cp chrome/wasm/neodetect-loader.js firefox/wasm/
          cp chrome/popup/popup.html firefox/popup/
          
          # Transform popup.js
          sed 's/chrome\./browser./g' chrome/popup/popup.js > firefox/popup/popup.js
          
          # Transform content.js
          sed 's/chrome\./browser./g' chrome/content/content.js > firefox/content/content.js
      
      - name: Package Chrome extension
        run: |
          cd deploy/trinity-nexus/extensions/chrome
          VERSION="${{ steps.version.outputs.version }}"
          zip -r ../neodetect-chrome-v${VERSION}.zip . \
            -x "*.DS_Store" \
            -x "__MACOSX/*" \
            -x "screenshots/*" \
            -x "promo/*" \
            -x "*.md"
          
          echo "Chrome package:"
          ls -la ../neodetect-chrome-v${VERSION}.zip
      
      - name: Package Firefox extension
        run: |
          cd deploy/trinity-nexus/extensions/firefox
          VERSION="${{ steps.version.outputs.version }}"
          zip -r ../neodetect-firefox-v${VERSION}.zip . \
            -x "*.DS_Store" \
            -x "__MACOSX/*" \
            -x "screenshots/*" \
            -x "promo/*" \
            -x "*.md"
          
          echo "Firefox package:"
          ls -la ../neodetect-firefox-v${VERSION}.zip
      
      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: neodetect-chrome
          path: deploy/trinity-nexus/extensions/neodetect-chrome-*.zip
      
      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: neodetect-firefox
          path: deploy/trinity-nexus/extensions/neodetect-firefox-*.zip

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Chrome artifact
        uses: actions/download-artifact@v8
        with:
          name: neodetect-chrome
          path: ./artifacts
      
      - name: Download Firefox artifact
        uses: actions/download-artifact@v8
        with:
          name: neodetect-firefox
          path: ./artifacts
      
      - name: List artifacts
        run: ls -la ./artifacts/
      
      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          cat << EOF > release_notes.md
          ## NeoDetect Anti-Detect Browser Extension v${VERSION}
          
          ### Downloads
          
          | Browser | File |
          |---------|------|
          | Chrome | \`neodetect-chrome-v${VERSION}.zip\` |
          | Firefox | \`neodetect-firefox-v${VERSION}.zip\` |
          
          ### Installation
          
          **Chrome:**
          1. Download \`neodetect-chrome-v${VERSION}.zip\`
          2. Extract the ZIP file
          3. Open \`chrome://extensions/\`
          4. Enable "Developer mode"
          5. Click "Load unpacked" and select the extracted folder
          
          **Firefox:**
          1. Download \`neodetect-firefox-v${VERSION}.zip\`
          2. Open \`about:debugging#/runtime/this-firefox\`
          3. Click "Load Temporary Add-on"
          4. Select the ZIP file
          
          ### Features
          
          - WASM-powered fingerprint protection
          - Canvas, WebGL, Audio fingerprint spoofing
          - Navigator and screen property spoofing
          - WebRTC IP leak protection
          - OS/Hardware/GPU emulation
          - Profile management (save/load/export)
          - AI-powered fingerprint evolution
          
          ### Links
          
          - [Documentation](https://github.com/gHashTag/trinity/tree/main/deploy/trinity-nexus/extensions)
          - [Privacy Policy](https://github.com/gHashTag/trinity/blob/main/deploy/trinity-nexus/extensions/chrome/PRIVACY_POLICY.md)
          - [Source Code](https://github.com/gHashTag/trinity)
          
          ---
          **KOSCHEI IS IMMORTAL | GOLDEN CHAIN IS CLOSED**
          EOF
          
          cat release_notes.md
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NeoDetect v${{ needs.build.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          # The browser extension is a side artifact, not the repository's
          # headline download. v2 defaults make_latest to true, which would put
          # an ext-v* tag at the top of the releases page ahead of Trinity.
          make_latest: false
          files: |
            ./artifacts/neodetect-chrome-*.zip
            ./artifacts/neodetect-firefox-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
