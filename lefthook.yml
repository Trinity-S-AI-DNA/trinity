# Git hooks for trinity. Install once per clone: `lefthook install`
# Requires gitleaks (`brew install gitleaks`). A missing gitleaks fails the
# hook on purpose: the secret gate must not silently turn itself off.
# Rules live in .gitleaks.toml; the CI twin is .github/workflows/secret-scan.yml.

commit-msg:
  commands:
    english-only:
      run: |
        msg=$(head -1 {1})
        if LC_ALL=C printf '%s' "$msg" | grep -q '[^ -~]'; then
          echo "Commit subjects must be English ASCII."
          exit 1
        fi

pre-commit:
  commands:
    secret-gate:
      run: gitleaks git --staged --no-banner --redact --config .gitleaks.toml .
    queen-bilingual-contract:
      root: "apps/website/"
      run: npm run check:queen-languages
    explorer-bilingual-contract:
      root: "apps/website/"
      run: npm run check:explorer-languages

pre-push:
  commands:
    secret-gate:
      run: gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts="HEAD --not --remotes" .
    branch-name:
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        if [[ "$branch" == "main" || "$branch" == "master" ]]; then
          exit 0
        fi
        if [[ ! "$branch" =~ ^(feat|fix|docs|refactor|test|chore)/[a-z0-9-]+$ ]]; then
          echo "Branch name '$branch' does not match the required format."
          echo "Use: <type>/<short-description>"
          exit 1
        fi
