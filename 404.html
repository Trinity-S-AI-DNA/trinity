<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>TRINITY</title>
<!--
  GitHub Pages serves this file for any path it has no file for. The app is a
  HashRouter SPA, so its screens live at /#/canvas, /#/lab and so on — and a
  visitor who types, bookmarks or is linked to the PATH form lands here.

  Measured 2026-08-13: /canvas /lab /play /dashboard /tree /quantum /start
  /wasm /chat /viz all returned HTTP 404 and then rendered the HOMEPAGE, so the
  reader silently got the wrong screen with a 404 in the network tab. Ten routes
  declared in the bundle, none reachable by its own path.

  This does not touch the prerendered static pages (/about/, /resources/, /ru/
  and the rest): those are real files, so Pages never falls through to here.
  It also leaves the query string and any deeper path intact, so /viz/foo?x=1
  arrives as /#/viz/foo?x=1 rather than being flattened.

  Redirect is location.replace, not assign, so the 404 does not become a Back
  button trap.
-->
<script>
  (function () {
    var l = window.location;
    var path = l.pathname.replace(/^\/+/, '');
    // A bare 404 with nothing to route to: send the reader to the front page
    // rather than to "#/" which the router would only bounce again.
    if (!path) { l.replace('/'); return; }
    // l.hash is deliberately dropped. On a hash-router site the fragment IS
    // the route, so a path-form URL cannot also carry a meaningful one --
    // appending it produced /#/quantumfrag, a route that does not exist.
    l.replace('/#/' + path.replace(/\/+$/, '') + l.search);
  })();
</script>
<meta http-equiv="refresh" content="1;url=/" />
</head>
<body>
<!-- Shown only if JavaScript is off, in which case the hash route cannot work
     anyway and the front page is the honest destination. -->
<p>Redirecting… If nothing happens, <a href="/">open t27.ai</a>.</p>
</body>
</html>
