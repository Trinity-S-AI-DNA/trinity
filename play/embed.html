<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>t27 in a post &middot; Trinity S&sup3;AI</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Outfit;src:url(../fonts/outfit-latin.woff2) format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#ebebeb;overflow:hidden}
html{font-size:clamp(11px,1.9vw,15px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font:1rem/1.35 Outfit,system-ui,sans-serif;display:grid;grid-template-rows:auto 1fr auto;height:100vh}
.mono,pre,textarea,code{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
a{color:#00ff88;text-decoration:none}a:hover{color:#fff}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
header{display:flex;align-items:center;gap:.6em;padding:.35em .7em;border-bottom:1px solid rgba(255,255,255,.08);background:#050505;white-space:nowrap;min-width:0}
header .brand{display:flex;align-items:center;gap:.35em;color:#fff;font-weight:700}
header .brand img{width:1.15em;height:1.15em}
header .file{color:#ffd700;overflow:hidden;text-overflow:ellipsis;min-width:0}
nav{display:flex;gap:.2em;margin-left:auto}
nav button{padding:.15em .55em;border-radius:999px;color:#888;border:1px solid transparent}
nav button:hover{color:#fff}
nav button[aria-selected=true]{color:#000;background:#00ff88;font-weight:600}
main{min-height:0;display:grid;grid-template-columns:1fr;position:relative}
main.wide{grid-template-columns:minmax(0,44fr) minmax(0,56fr)}
main.wide #pane-spec{display:block!important;border-right:1px solid rgba(255,255,255,.08)}
body.wide .tab-spec{display:none}
.pane{min-height:0;overflow:auto;display:none}
.pane.on{display:block}
footer{display:flex;align-items:center;gap:.7em;padding:.3em .7em;border-top:1px solid rgba(255,255,255,.08);background:#050505;color:#888;font-size:.85rem;white-space:nowrap;overflow:hidden}
footer .st{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
footer .st b{color:#ebebeb;font-weight:500}
footer .ok{color:#00ff88}footer .bad{color:#ff5c5c}
footer a{flex:none}footer #orch{color:#888}footer #orch:hover{color:#fff}

/* spec editor: the compiler's own tokens, coloured; a transparent textarea on top */
.ed{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;position:relative;display:inline-block;vertical-align:top;min-width:100%;min-height:100%;font-size:.86rem;line-height:1.45}
.ed pre,.ed textarea{margin:0;padding:.6em .8em .6em 3.4em;white-space:pre;tab-size:4;font:inherit;line-height:inherit;border:0}
.ed pre{pointer-events:none;color:#ebebeb;counter-reset:ln}
.ed pre .l{display:block;position:relative;min-height:1.45em}
/* the line number stays at the pane's left edge when a long line scrolls the pane sideways */
.ed pre .l::before{counter-increment:ln;content:counter(ln);position:sticky;left:0;z-index:1;display:inline-block;box-sizing:border-box;margin-left:-3.4em;padding:0 .7em 0 .3em;width:3.4em;text-align:right;color:#444;background:#000}
.ed pre .l.hit{background:rgba(255,92,92,.12)}
.ed textarea{position:absolute;inset:0;width:100%;height:100%;resize:none;color:transparent;background:transparent;caret-color:#00ff88;outline:none;overflow:hidden}
.ed textarea::selection{background:rgba(0,255,136,.25)}
/* on a touch screen the text is never small enough for iOS to zoom into the focused editor */
@media (pointer:coarse){.ed{font-size:var(--ed-touch-font)}}
/* token colours: CLS_COLOR from the site's highlighter, set on :root by embed.js from site.js */
.h-kw{color:var(--h-kw)}.h-num{color:var(--h-num)}.h-str{color:var(--h-str)}.h-ident{color:var(--h-ident)}.h-op{color:var(--h-op)}
.h-punct{color:var(--h-punct)}.h-comment{color:var(--h-comment);font-style:italic}.h-type{color:var(--h-type)}
.dropped{text-decoration:underline wavy #ff5c5c}

/* compile: the run as a short linear piece, every number from the compiler */
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:.4em .9em;padding:.6em .8em;height:100%;min-height:15em}
.stages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
.stages li{display:grid;grid-template-columns:5.2em 1fr;align-items:baseline;gap:.4em;opacity:.18;transition:opacity .35s}
.stages li.on{opacity:1}
.stages .lb{color:#888;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em}
.stages .vl{color:#fff;font-variant-numeric:tabular-nums;min-width:0}
.stages .vl i{font-style:normal;color:#888}
.stages .vl .nw{white-space:nowrap}
.stages .vl .g{color:#00ff88}.stages .vl .r{color:#ff5c5c}.stages .vl .y{color:#ffd700}
.viz{display:grid;grid-template-rows:auto 1fr auto auto;gap:.3em;min-height:0}
.viz h4{margin:0;font-size:.78rem;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}
.viz svg{width:100%;height:100%;min-height:5em;display:block}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:.12em .45em;font-size:.8rem;align-items:center}
.bars span{color:#888}.bars em{font-style:normal;color:#ebebeb;font-variant-numeric:tabular-nums;text-align:right}
.bars div{height:.55em;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.bars div i{display:block;height:100%;width:0;background:#00ff88;transition:width .5s}
.bars div i.x{background:#ff5c5c}
.tokbar{display:flex;height:.55em;border-radius:2px;overflow:hidden;margin-top:.15em}
.tokbar i{display:block;height:100%}
.ctl{display:flex;gap:.3em;text-transform:none}
.ctl button{width:1.9em;height:1.9em;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:#0a0a0a;color:#fff;font-size:.8rem;line-height:1}
.ctl button:hover{border-color:#00ff88;color:#00ff88}

/* tests */
.tests{padding:.6em .8em}
.tests .row{display:grid;grid-template-columns:1.4em 4.8em 1fr auto;gap:.4em;align-items:baseline;padding:.25em 0;border-bottom:1px solid rgba(255,255,255,.05)}
.tests .row .m{font-weight:700}
.tests .pass .m{color:#00ff88}.tests .fail .m{color:#ff5c5c}.tests .skip .m{color:#888}
.tests .kd{color:#888;font-size:.82rem}
.tests .nm{color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tests .why{grid-column:3/5;color:#ff9c9c;font-size:.8rem}
.tests .skip .why{color:#888}
.tests .sum{margin:.2em 0 .5em;color:#888}.tests .sum b{color:#fff}
.note{color:#888;font-size:.8rem;border-left:2px solid #00ff88;padding-left:.6em;margin:.7em 0 0}

/* code */
.code{display:grid;grid-template-rows:auto 1fr auto;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:.25em;padding:.45em .8em}
.chips button{border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:.05em .5em;color:#bbb;font-size:.85rem}
.chips button small{color:#666;margin-left:.3em}
.chips button[aria-pressed=true]{border-color:#00ff88;color:#00ff88}
.chips button.x{color:#ff5c5c;border-color:rgba(255,92,92,.4)}
.code pre{margin:0;padding:.4em .8em;overflow:auto;font-size:.8rem;line-height:1.4;color:#ddd;min-height:0;background:#030303;border-top:1px solid rgba(255,255,255,.05)}
.code .meta{padding:.3em .8em;color:#888;font-size:.78rem;display:flex;gap:.8em;flex-wrap:wrap;align-items:center}
.code .meta code{color:#ffd700}
.code .meta button,.rtl .act button{color:#00ff88;border:1px solid rgba(0,255,136,.4);border-radius:6px;padding:0 .5em}
.code .meta button:hover,.rtl .act button:hover{background:rgba(0,255,136,.1)}
.code pre.out{color:#00ff88;max-height:8em;border-top:1px solid rgba(0,255,136,.2)}

/* rtl: the emitted Verilog, read before synthesis */
.rtl{padding:.45em .8em .8em;font-size:.86rem}
.rtl .top{display:flex;flex-wrap:wrap;align-items:center;gap:.25em .8em}
.rtl .top .chips{padding:0}
.rtl .top .mod{color:#888;font-size:.8rem}.rtl .top .mod code{color:#ffd700}
.rtl .act{display:flex;gap:.35em;margin-left:auto;font-size:.78rem}
.rtl h4{margin:.8em 0 .3em;font-size:.78rem;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;gap:1em}
.rtl h4 span{text-transform:none;letter-spacing:0}
.rtl .sum{display:flex;flex-wrap:wrap;gap:.2em .9em;margin-top:.45em;color:#888;font-size:.8rem}
.rtl .sum b{font-weight:600}.rtl .sum .e{color:var(--c-bad)}.rtl .sum .w{color:var(--c-warn)}.rtl .sum .ok{color:#00ff88}
.rtl .finds{list-style:none;margin:0;padding:0;font-size:.8rem}
.rtl .finds li{display:grid;grid-template-columns:1.3em 1fr auto;gap:.4em;padding:.18em 0;border-bottom:1px solid rgba(255,255,255,.05)}
.rtl .finds .m{font-weight:700}.rtl .finds .error .m{color:var(--c-bad)}.rtl .finds .warn .m{color:var(--c-warn)}.rtl .finds .info .m{color:#888}
.rtl .finds .info{color:#aaa}.rtl .finds .ln{color:#555;font-variant-numeric:tabular-nums}
.rtl .bits{display:flex;height:2.1em;border:1px solid rgba(0,255,136,.1);border-radius:4px;overflow:hidden;background:#0b0d0c}
.rtl .bits i{display:flex;align-items:center;justify-content:center;min-width:2px;font-style:normal;font-size:.7rem;color:#000;font-weight:600;overflow:hidden;white-space:nowrap;border-left:1px solid #000}
.rtl .bits i:first-child{border-left:0}
.rtl .bits i.dflt{background-image:repeating-linear-gradient(135deg,transparent 0 4px,rgba(0,0,0,.35) 4px 6px)}
.rtl .scale{display:flex;justify-content:space-between;color:#555;font-size:.7rem;font-variant-numeric:tabular-nums;margin-top:.1em}
.rtl table{border-collapse:collapse;width:100%;font-size:.8rem}
.rtl td,.rtl th{padding:.12em .6em .12em 0;text-align:left;vertical-align:baseline;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap}
.rtl th{color:#666;font-weight:500}
.rtl td.n{text-align:right;font-variant-numeric:tabular-nums;color:#fff}
.rtl td.dim{color:#888}.rtl td.w{color:var(--c-warn)}
.rtl td code,.rtl .fn code{color:var(--h-ident)}
.rtl .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(19em,1fr));gap:0 1.2em}.rtl .cols>div{min-width:0}
.rtl td.v{white-space:normal;overflow-wrap:anywhere}
.rtl .try{margin:0;padding:.35em .6em;background:#030303;border:1px solid rgba(255,255,255,.06);border-radius:4px;font-size:.76rem;line-height:1.5;overflow:auto;color:#ddd}
.rtl .try .p{color:#555;user-select:none}
.rtl .st{margin:.2em 0 .6em}.rtl .st .sn{font-size:.8rem;color:#888;margin-bottom:.25em}.rtl .st .sn code{color:var(--h-type)}
.rtl .st .ok{color:#00ff88}.rtl .st .e{color:var(--c-bad)}
.rtl .legend{display:flex;flex-wrap:wrap;gap:.1em 1em;font-size:.74rem;color:#888;font-variant-numeric:tabular-nums}
.rtl .legend b{font-weight:600}.rtl .legend em{font-style:normal}.rtl .legend .w{color:var(--c-warn)}
.rtl .dim{color:#888}.rtl p.dim{font-size:.78rem;margin:.3em 0}.rtl p.dim code{color:var(--h-type)}
.rtl td span.dim,.rtl td .dim{margin-left:.4em;font-size:.72rem;color:#666}
.rtl sub{font-size:.66em;color:#666}
.rtl h4 .cp{margin-left:auto;text-transform:none;letter-spacing:0;color:#00ff88;border:1px solid rgba(0,255,136,.4);border-radius:6px;padding:0 .5em;font-size:.74rem}
.rtl h4 .cp:hover{background:rgba(0,255,136,.1)}
.rtl .note{color:#666;font-size:.74rem;margin:.5em 0 0}

/* term: a terminal over the same compiler (shell.js), and the recording it can replay */
#pane-term.on{display:flex;flex-direction:column}
#pane-term .t27t .shr{display:none}
.sh{display:flex;flex-direction:column;flex:1;min-height:0;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;line-height:1.4;background:#030303}
.sh-out{flex:1;min-height:0;overflow:auto;padding:.5em .8em;position:relative;outline:none;white-space:pre-wrap;overflow-wrap:anywhere;color:#ddd}
.sh-out .ln{min-height:1.4em}
.sh-out .ln.cmd{margin-top:.35em;color:#fff}
.sh-out .ln.dim,.sh-out i{color:#777;font-style:normal}
.sh-out b{font-weight:600;color:#fff}
.sh-out .g{color:#00ff88}.sh-out .r{color:#ff5c5c}.sh-out .y{color:#ffd700}
.sh-out s{color:#666}
.sh-out .ps,.sh-in .ps{color:#00ff88;user-select:none}
.sh-out pre.blk{margin:.2em 0 .3em;padding:.35em .6em;background:#000;border-left:2px solid rgba(0,255,136,.25);white-space:pre;overflow:auto;font:inherit}
.sh-out pre.out{color:#00ff88}
.sh-box{margin:.3em 0}
.sh-in{display:flex;align-items:center;gap:.5em;padding:.3em .8em;border-top:1px solid rgba(255,255,255,.08)}
.sh-in input{flex:1;min-width:0;font:inherit;color:#fff;background:transparent;border:0;outline:none;caret-color:#00ff88;padding:.2em 0}
.sh-chips{flex-wrap:nowrap;overflow-x:auto;padding:.3em .8em .45em;scrollbar-width:none}
.sh-chips button{white-space:nowrap;font-size:.78rem}
.sh-chips button.cmd{color:#00ff88;border-color:rgba(0,255,136,.3)}
/* on a touch screen the prompt is never small enough for iOS to zoom into it */
@media (pointer:coarse){.sh-in input{font-size:var(--ed-touch-font)}}
.empty{padding:1em;color:#888}

@media (max-aspect-ratio:1/1){
  /* the page scrolls here, and body must not be a scroller of its own or nothing in it can stick */
  html{overflow:auto;scroll-padding:3rem 0 2.5rem}
  body{overflow:visible;height:auto;min-height:100vh}
  /* so the tabs and the compile verdict stay put while the editor moves; the padding above keeps
     the caret's line out from under them when the browser scrolls to it */
  header{position:sticky;top:0;z-index:2}
  footer{position:sticky;bottom:0;z-index:2}
  .cmp{grid-template-columns:1fr;height:auto}
  .viz svg{height:9em}
  /* the page scrolls, so the terminal takes the screen between the header and the footer */
  #pane-term.on{height:calc(100vh - 5rem);min-height:18em}
}
@media (prefers-reduced-motion:reduce){.stages li,.bars div i{transition:none}}
</style>
</head>
<body>
<header>
  <a class="brand" href="https://t27.ai/" target="_blank" rel="noopener"><img src="../favicon.svg" alt="">t27</a>
  <span class="file mono" id="file">&hellip;</span>
  <nav role="tablist" id="tabs" aria-label="Views"></nav>
</header>
<main id="main">
  <section class="pane" id="pane-spec"><div class="ed"><pre id="hl" aria-hidden="true"></pre><textarea id="src" wrap="off" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" aria-label="Spec source; edit it and it recompiles"></textarea></div></section>
  <section class="pane" id="pane-compile"></section>
  <section class="pane" id="pane-tests"></section>
  <section class="pane" id="pane-code"></section>
  <section class="pane" id="pane-rtl"></section>
  <section class="pane" id="pane-term"></section>
</main>
<footer><span class="st" id="status">loading the t27 compiler&hellip;</span><a id="orch" href="player.t27" target="_blank" rel="noopener" title="The t27 spec this player is built from">player.t27</a><a id="open" href="https://t27.ai/" target="_blank" rel="noopener">Open on t27.ai &#8599;</a></footer>
