<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>T27F live &middot; Trinity S&sup3;AI</title>
<meta name="description" content="T27F live: a recorded agent log replayed through t27f.wasm. Layout, colour and state come from hud.t27, a11y_mirror.t27 and live_mode.t27.">
<link rel="canonical" href="https://t27.ai/t27f/live/">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#000;--panel:#0b0d0c;--line:rgba(0,255,136,.10);--text:#fff;--muted:#8b9490;--accent:#00ff88}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.55 system-ui,sans-serif}
header{display:flex;align-items:baseline;gap:1rem;padding:.9rem 1.25rem;border-bottom:1px solid var(--line)}
header a.home{font-weight:700;letter-spacing:.08em;color:#fff;text-decoration:none}
header span{color:var(--muted);font-size:.85rem;letter-spacing:.14em;text-transform:uppercase}
main{padding:1.5rem 1.25rem 3rem}
h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:700;margin:0 0 .5rem}
p{max-width:62rem;margin:.25rem 0 1rem;color:var(--muted)}
#status{margin:1rem 0 .75rem;font:500 .9rem/1.5 monospace;color:var(--accent)}
#stage{min-height:8rem;padding:1rem;background:var(--panel);border:1px solid var(--line);border-radius:8px;font:500 1.1rem/1.6 monospace;color:var(--accent)}
</style>
</head>
<body>
<header><a class="home" href="../../">t27.ai</a><span>T27F</span></header>
<main>
<h1>T27F live</h1>
<p>A recorded agent log replayed through <code>t27f.wasm</code>. Layout, colour and state come from <code>hud.t27</code>, <code>a11y_mirror.t27</code> and <code>live_mode.t27</code>; the loader holds none of them. See <a href="./PROVENANCE.txt">PROVENANCE.txt</a>.</p>
<div id="status" role="status">Loading the T27F wasm&hellip;</div>
<div id="stage" aria-live="polite"></div>
<noscript><p>This page runs WebAssembly and needs JavaScript.</p></noscript>
</main>
<script type="module" src="./live.js"></script>
</body>
</html>
